<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Endereço por UBS - Sorocaba</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        /* Estilização Moderna e Responsiva */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f6f9; 
            color: #333;
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { margin-top: 0; color: #1e293b; font-size: 24px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 20px; }
        
        .busca-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #3b82f6; }
        button { 
            padding: 14px 28px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px; 
            white-space: nowrap; 
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        
        #map { 
            height: 55vh; 
            min-height: 350px;
            max-height: 600px;
            width: 100%; 
            margin-top: 20px; 
            border-radius: 8px; 
            display: none; 
            z-index: 1; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        #resultado { 
            margin-top: 20px; 
            padding: 18px; 
            border-radius: 6px; 
            font-weight: 600; 
            line-height: 1.5;
            display: none; 
            word-wrap: break-word;
        }
        
        .sucesso { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .erro { background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        .info { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        .rotulo-ubs {
            background: none;
            border: none;
            box-shadow: none;
            font-size: 14px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            text-shadow: 
                -2px -2px 0 #FFF, 2px -2px 0 #FFF, 
                -2px 2px 0 #FFF, 2px 2px 0 #FFF,
                -1px 0px 0 #FFF, 1px 0px 0 #FFF,
                0px -1px 0 #FFF, 0px 1px 0 #FFF;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .busca-box { flex-direction: column; }
            button { width: 100%; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Descubra sua UBS - Sorocaba</h2>
    <p>Digite seu logradouro (Ex: Avenida Itavuvu):</p>
    
    <div class="busca-box">
        <input type="text" id="endereco" placeholder="Rua, avenida, Sorocaba - SP">
        <button onclick="buscarEndereco()">Buscar</button>
    </div>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<script>
    let dadosUbs = null;
    let map = null;
    let camadasBusca = L.layerGroup();
    let camadasPoligonos = L.layerGroup(); 

    document.getElementById('endereco').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { buscarEndereco(); }
    });

    function initMap(lat, lon, zoom = 13) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], zoom);
            
            // CORREÇÃO: Voltando para o estilo clássico e colorido original do OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            camadasBusca.addTo(map);
            camadasPoligonos.addTo(map);
        }
        setTimeout(() => { map.invalidateSize(); }, 200);
    }

    // Carrega a base de dados GeoJSON das UBSs
    fetch('abrangencia_ubs_sorocaba.json')
        .then(response => {
            if (!response.ok) throw new Error("Falha ao carregar o arquivo abrangencia_ubs_sorocaba.json.");
            return response.json();
        })
        .then(data => { dadosUbs = data; })
        .catch(error => mostrarResultado("Erro ao carregar banco de dados das UBS. Verifique se o arquivo JSON está na mesma pasta.", "erro"));

    function buscarEndereco() {
        let enderecoDigitado = document.getElementById('endereco').value.trim();
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um logradouro.", "erro");
            return;
        }

        const buscaFinal = enderecoDigitado.toLowerCase().includes("sorocaba") ? enderecoDigitado : `${enderecoDigitado}, Sorocaba, SP`;
        mostrarResultado("Mapeando malha viária completa de ponta a ponta...", "info");

        // Passo 1: Nominatim descobre o nome oficial padronizado da rua no OSM
        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaFinal)}&limit=5&accept-language=pt-BR&email=geosaude.sorocaba.app@gmail.com`;

        fetch(urlGeocode)
            .then(response => {
                if (!response.ok) throw new Error(`Erro do servidor de mapas: ${response.status}`);
                return response.json();
            })
            .then(resultados => {
                if (resultados.length === 0) throw new Error("Logradouro não encontrado na base de dados. Tente verificar a grafia.");

                let viasEncontradas = resultados.filter(r => r.class === 'highway');
                let nomeOficial = "";
                let latCentro = 0, lonCentro = 0;

                if (viasEncontradas.length > 0) {
                    nomeOficial = viasEncontradas[0].name;
                    latCentro = parseFloat(viasEncontradas[0].lat);
                    lonCentro = parseFloat(viasEncontradas[0].lon);
                } else {
                    nomeOficial = resultados[0].name;
                    latCentro = parseFloat(resultados[0].lat);
                    lonCentro = parseFloat(resultados[0].lon);
                }

                // Passo 2: Consulta à Overpass API buscando TODOS os segmentos da via em Sorocaba (Sem limites de cortes!)
                const overpassQuery = `[out:json][timeout:15];area["name"="Sorocaba"]->.a;way(area.a)["name"="${nomeOficial}"];out geom;`;
                const urlOverpass = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`;

                return fetch(urlOverpass)
                    .then(res => {
                        if (!res.ok) return { elements: [] }; // Fallback caso Overpass fique offline
                        return res.json();
                    })
                    .then(overpassData => {
                        return { resultados, nomeOficial, latCentro, lonCentro, overpassData };
                    });
            })
            .then(({ resultados, nomeOficial, latCentro, lonCentro, overpassData }) => {
                camadasBusca.clearLayers();
                camadasPoligonos.clearLayers();
                initMap(latCentro, lonCentro);

                let ubsEncontradasFeatures = [];
                let ubsNomes = new Set();
                let boundsGeral = L.latLngBounds();

                // Se a Overpass API retornou dados com sucesso, usamos a malha 100% completa
                if (overpassData && overpassData.elements && overpassData.elements.length > 0) {
                    overpassData.elements.forEach(el => {
                        if (el.geometry && el.geometry.length > 1) {
                            let coordsTurf = el.geometry.map(pt => [pt.lon, pt.lat]);
                            let featureElemento = turf.lineString(coordsTurf);

                            let coordsLeaflet = el.geometry.map(pt => [pt.lat, pt.lon]);
                            const linhaNoMapa = L.polyline(coordsLeaflet, { color: "#ff2222", weight: 5, opacity: 0.85 }).addTo(camadasBusca);
                            boundsGeral.extend(linhaNoMapa.getBounds());

                            if (dadosUbs) {
                                turf.featureEach(dadosUbs, function (ubsPoligono) {
                                    if (turf.booleanIntersects(featureElemento, ubsPoligono)) {
                                        let nomeUbs = ubsPoligono.properties.UBS;
                                        if (!ubsNomes.has(nomeUbs)) {
                                            ubsNomes.add(nomeUbs);
                                            ubsEncontradasFeatures.push(ubsPoligono);
                                        }
                                    }
                                });
                            }
                        }
                    });
                } else {
                    // FALLBACK: Caso a Overpass API falhe, usa o processamento padrão via Nominatim limitado
                    let alvosGeograficos = resultados.filter(r => r.name === nomeOficial).slice(0, 50);
                    if (alvosGeograficos.length === 0) alvosGeograficos = [resultados[0]];

                    alvosGeograficos.forEach(alvo => {
                        if (alvo.geojson) {
                            const featureElemento = turf.feature(alvo.geojson);
                            const linhaNoMapa = L.geoJSON(alvo.geojson, {
                                style: { color: "#ff2222", weight: 5, opacity: 0.85 }
                            }).addTo(camadasBusca);
                            boundsGeral.extend(linhaNoMapa.getBounds());

                            if (dadosUbs) {
                                turf.featureEach(dadosUbs, function (ubsPoligono) {
                                    if (turf.booleanIntersects(featureElemento, ubsPoligono)) {
                                        let nomeUbs = ubsPoligono.properties.UBS;
                                        if (!ubsNomes.has(nomeUbs)) {
                                            ubsNomes.add(nomeUbs);
                                            ubsEncontradasFeatures.push(ubsPoligono);
                                        }
                                    }
                                });
                            }
                        }
                    });
                }

                // Renderiza os polígonos das UBS encontradas
                if (ubsEncontradasFeatures.length > 0) {
                    let htmlResultado = `Logradouro identificado! Cruza a área de abrangência de <b>${ubsEncontradasFeatures.length}</b> UBS(s):<br><br>`;
                    
                    ubsEncontradasFeatures.forEach(feature => {
                        let nomeUbs = feature.properties.UBS;
                        htmlResultado += `📍 UBS ${nomeUbs}<br>`;
                        
                        const poliLayer = L.geoJSON(feature, {
                            style: { color: "#10b981", weight: 2.5, fillOpacity: 0.12 }
                        }).addTo(camadasPoligonos);
                        
                        boundsGeral.extend(poliLayer.getBounds());

                        try {
                            let centro = turf.centerOfMass(feature);
                            let coords = centro.geometry.coordinates;
                            
                            L.marker([coords[1], coords[0]], {
                                icon: L.divIcon({
                                    className: 'rotulo-ubs',
                                    html: `<div>UBS ${nomeUbs.toUpperCase()}</div>`,
                                    iconSize: [160, 40],
                                    iconAnchor: [80, 20]
                                }),
                                interactive: false
                            }).addTo(camadasPoligonos);
                        } catch (e) {}
                    });

                    if (ubsEncontradasFeatures.length > 1) {
                         htmlResultado += `<br><small style="color:#64748b; font-weight:normal;"><i>Nota: Esta via cruza múltiplas regiões. Para saber a UBS exata, inclua a numeração no momento da busca no futuro.</i></small>`;
                    }

                    mostrarResultado(htmlResultado, "sucesso");
                    map.fitBounds(boundsGeral, { padding: [30, 30] }); 

                } else {
                    mostrarResultado("Logradouro localizado, mas fora das áreas de UBS cadastradas.", "erro");
                    if (boundsGeral.isValid()) {
                        map.fitBounds(boundsGeral, { padding: [30, 30] });
                    } else {
                        map.setView([latCentro, lonCentro], 15);
                    }
                }
            })
            .catch(error => {
                mostrarResultado(`Ops! Ocorreu um erro: ${error.message}`, "erro");
                console.error(error);
            });
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>
</body>
</html>
