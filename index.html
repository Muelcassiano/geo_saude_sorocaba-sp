<script>
    let dadosUbs = null;
    let map = null;
    let camadasBusca = L.layerGroup(); // Grupo para limpar facilmente as marcações antigas do mapa
    let camadasPoligonos = L.layerGroup(); 

    function initMap(lat, lon, zoom = 14) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            camadasBusca.addTo(map);
            camadasPoligonos.addTo(map);
        }
    }

    fetch('abrangencia_ubs_sorocaba.json')
        .then(response => {
            if (!response.ok) throw new Error("Não foi possível carregar o arquivo de UBS.");
            return response.json();
        })
        .then(data => {
            dadosUbs = data;
            console.log("Dados das UBS carregados com sucesso!");
        })
        .catch(error => mostrarResultado("Erro ao carregar banco de dados das UBS.", "erro"));

    function buscarEndereco() {
        const enderecoDigitado = document.getElementById('endereco').value;
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um endereço.", "erro");
            return;
        }

        const buscaFinal = enderecoDigitado.toLowerCase().includes("sorocaba") ? enderecoDigitado : `${enderecoDigitado}, Sorocaba, SP`;
        mostrarResultado("Analisando malha viária...", "info");

        // ADIÇÃO CRÍTICA: &polygon_geojson=1 traz o formato exato (ponto ou linha da rua inteira)
        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaFinal)}&limit=1&polygon_geojson=1`;

        fetch(urlGeocode)
            .then(response => response.json())
            .then(resultados => {
                if (resultados.length === 0) {
                    throw new Error("Endereço não encontrado.");
                }

                camadasBusca.clearLayers();
                camadasPoligonos.clearLayers();

                const lat = parseFloat(resultados[0].lat);
                const lon = parseFloat(resultados[0].lon);
                
                // Extrai a geometria devolvida pela API (Ponto ou Linha)
                const formatoGeoJson = resultados[0].geojson;
                
                initMap(lat, lon);

                // Desenha o formato retornado no mapa (Ponto ou Linha da rua)
                const elementoBuscado = L.geoJSON(formatoGeoJson, {
                    style: { color: "#ff0000", weight: 4 },
                    pointToLayer: function (feature, latlng) {
                        return L.marker(latlng);
                    }
                }).addTo(camadasBusca);

                let ubsEncontradas = [];
                let boundsGeral = L.latLngBounds();

                // 3. Varre os polígonos usando Intersecção, não apenas Ponto Interno
                turf.featureEach(dadosUbs, function (currentFeature) {
                    // booleanIntersects avalia se a linha da rua cruza o polígono da UBS
                    if (turf.booleanIntersects(formatoGeoJson, currentFeature)) {
                        ubsEncontradas.push(currentFeature.properties.UBS); 
                        
                        // Desenha o polígono afetado no mapa
                        const poliLayer = L.geoJSON(currentFeature, {
                            style: { color: "#28a745", weight: 2, fillOpacity: 0.15 }
                        }).addTo(camadasPoligonos);
                        
                        boundsGeral.extend(poliLayer.getBounds());
                    }
                });

                if (ubsEncontradas.length > 0) {
                    // Remove duplicatas caso a API retorne segmentos repetidos
                    const ubsUnicas = [...new Set(ubsEncontradas)];
                    
                    let htmlResultado = `Endereço localizado! Faz parte da área de abrangência de <b>${ubsUnicas.length}</b> UBS(s):<br><br>`;
                    ubsUnicas.forEach(ubs => {
                        htmlResultado += `📍 UBS ${ubs}<br>`;
                    });
                    
                    if (ubsUnicas.length > 1) {
                         htmlResultado += `<br><small><i>Nota: Como nenhuma numeração específica foi informada, listamos todas as áreas que cruzam esta via.</i></small>`;
                    }

                    mostrarResultado(htmlResultado, "sucesso");
                    map.fitBounds(boundsGeral); // Ajusta o zoom para mostrar todos os polígonos envolvidos

                } else {
                    mostrarResultado("Endereço localizado, mas fora das áreas cadastradas.", "erro");
                    map.fitBounds(elementoBuscado.getBounds());
                }
            })
            .catch(error => mostrarResultado(error.message, "erro"));
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>
