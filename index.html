<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Abrangência - UBS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        #search-container {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        input, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        #status { font-size: 12px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

<div id="search-container">
    <input type="text" id="endereco" placeholder="Digite o Logradouro e Número (ex: Rua X, 150)">
    <button onclick="buscarEndereco()">Pesquisar</button>
    <div id="status">Carregando base de dados...</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Inicialização do Mapa centrado na região
    const map = L.map('map').setView([-23.5015, -47.4581], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker = null;
    let baseUBS = new Map(); // Mapa para busca ultrarrápida O(1)

    // Função para carregar as 4 partes da base de dados e indexar por logradouro
    async function carregarBaseDeDados() {
        const arquivos = [
            'lotes_sorocaba_pontos_part1.json',
            'lotes_sorocaba_pontos_part2.json',
            'lotes_sorocaba_pontos_part3.json',
            'lotes_sorocaba_pontos_part4.json'
        ];

        try {
            for (const arquivo of arquivos) {
                const response = await fetch(arquivo);
                if (!response.ok) continue;
                
                const data = await response.json();
                
                // Extrai apenas o necessário para criar um índice rápido: Rua -> UBS
                data.features.forEach(feature => {
                    const props = feature.properties;
                    // Ajuste 'AL_Endere?' para o nome exato da chave de endereço no seu JSON, se necessário
                    let rua = props['AL_Endere?'] || props['ENDERECO'] || ""; 
                    let ubs = props['UBS'];
                    
                    if (rua && ubs) {
                        // Normaliza o nome da rua para facilitar a busca (sem acentos, minúsculas)
                        rua = rua.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                        if (!baseUBS.has(rua)) {
                            baseUBS.set(rua, ubs);
                        }
                    }
                });
            }
            document.getElementById('status').innerText = "Base carregada e pronta para pesquisa.";
            document.getElementById('status').style.color = "green";
        } catch (error) {
            console.error("Erro ao carregar a base de dados:", error);
            document.getElementById('status').innerText = "Erro ao carregar arquivos da base.";
            document.getElementById('status').style.color = "red";
        }
    }

    // Função principal de busca
    async function buscarEndereco() {
        const input = document.getElementById('endereco').value.trim();
        const statusDiv = document.getElementById('status');

        if (!input) {
            alert("Por favor, digite um endereço.");
            return;
        }

        statusDiv.innerText = "Buscando localização...";
        statusDiv.style.color = "blue";

        try {
            // 1. Busca as coordenadas usando a API do Nominatim (muito mais rápido que varrer GeoJSON)
            // Adicionando 'Sorocaba' para restringir e melhorar a precisão da busca
            const query = encodeURIComponent(`${input}, Sorocaba - SP`);
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`);
            const resultados = await response.json();

            if (resultados.length === 0) {
                statusDiv.innerText = "Endereço não encontrado no mapa.";
                statusDiv.style.color = "red";
                return;
            }

            const lat = parseFloat(resultados[0].lat);
            const lon = parseFloat(resultados[0].lon);

            // 2. Extrai rua e número do input do usuário para montar o Pop-up e buscar a UBS
            // Presume que o usuário digitou "Rua Nome, Numero"
            const partesInput = input.split(',');
            const ruaDigitada = partesInput[0].trim();
            const numeroDigitado = partesInput.length > 1 ? partesInput[1].trim() : "S/N";

            // Normaliza a rua digitada para buscar no nosso Map
            const ruaNormalizada = ruaDigitada.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            // Busca a UBS de forma instantânea na base indexada
            const ubsEncontrada = baseUBS.get(ruaNormalizada) || "Região de abrangência não encontrada";

            // 3. Atualiza o Mapa (Move o pino e abre o Pop-up com o número)
            if (marker) {
                map.removeLayer(marker);
            }

            marker = L.marker([lat, lon]).addTo(map);
            map.setView([lat, lon], 17); // Dá zoom no local exato

            // Monta o pop-up com a formatação solicitada
            const popupContent = `
                <div style="font-size: 14px;">
                    <strong>Logradouro:</strong> ${ruaDigitada}, ${numeroDigitado}<br>
                    <strong>UBS:</strong> ${ubsEncontrada}
                </div>
            `;
            
            marker.bindPopup(popupContent).openPopup();
            
            statusDiv.innerText = "Pesquisa concluída com sucesso!";
            statusDiv.style.color = "green";

        } catch (error) {
            console.error("Erro na pesquisa:", error);
            statusDiv.innerText = "Erro ao realizar a busca. Tente novamente.";
            statusDiv.style.color = "red";
        }
    }

    // Inicia o carregamento ao abrir a página
    carregarBaseDeDados();
</script>

</body>
</html>
