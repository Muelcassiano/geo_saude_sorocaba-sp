<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Endereço por UBS - Sorocaba</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Nova estrutura Flexbox para garantir que a busca nunca quebre na tela */
        .busca-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; white-space: nowrap; }
        button:hover { background-color: #0056b3; }
        
        #map { height: 400px; width: 100%; margin-top: 20px; border-radius: 4px; display: none; z-index: 1; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 4px; font-weight: bold; display: none; }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Descubra sua UBS - Sorocaba</h2>
    <p>Digite seu endereço completo (Ex: Rua XV de Novembro, 100):</p>
    
    <div class="busca-box">
        <input type="text" id="endereco" placeholder="Rua, número, Sorocaba - SP">
        <button onclick="buscarEndereco()">Buscar</button>
    </div>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<script>
    let dadosUbs = null;
    let map = null;
    let marcacaoPonto = null;
    let camadaPoligono = null;

    function initMap(lat, lon) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        } else {
            map.setView([lat, lon], 14);
        }
    }

    fetch('abrangencia_ubs_sorocaba.json')
        .then(response => {
            if (!response.ok) throw new Error("Não foi possível carregar o arquivo de UBS.");
            return response.json();
        })
        .then(data => {
            dadosUbs = data;
            console.log("Dados das UBS carregados com sucesso!");
        })
        .catch(error => {
            mostrarResultado("Erro ao carregar banco de dados das UBS. Verifique o nome do arquivo.", "erro");
            console.error(error);
        });

    function buscarEndereco() {
        const enderecoDigitado = document.getElementById('endereco').value;
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um endereço.", "erro");
            return;
        }

        const buscaFinal = enderecoDigitado.toLowerCase().includes("sorocaba") ? enderecoDigitado : `${enderecoDigitado}, Sorocaba, SP`;
        mostrarResultado("Buscando coordenadas do endereço...", "info");

        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaFinal)}&limit=1`;

        fetch(urlGeocode)
            .then(response => response.json())
            .then(resultados => {
                if (resultados.length === 0) {
                    throw new Error("Endereço não encontrado. Tente incluir o número ou o bairro.");
                }

                const lat = parseFloat(resultados[0].lat);
                const lon = parseFloat(resultados[0].lon);

                initMap(lat, lon);

                if (marcacaoPonto) map.removeLayer(marcacaoPonto);
                if (camadaPoligono) map.removeLayer(camadaPoligono);

                marcacaoPonto = L.marker([lat, lon]).addTo(map).bindPopup("Seu Endereço").openPopup();

                const pontoBusca = turf.point([lon, lat]);
                let ubsEncontrada = null;
                let featurePoligonoEncontrado = null;

                turf.featureEach(dadosUbs, function (currentFeature) {
                    if (turf.booleanPointInPolygon(pontoBusca, currentFeature)) {
                        ubsEncontrada = currentFeature.properties.UBS; 
                        featurePoligonoEncontrado = currentFeature;
                    }
                });

                if (ubsEncontrada) {
                    mostrarResultado(`Endereço localizado! Você pertence à área de abrangência da: <br><br>📍 <b>UBS ${ubsEncontrada}</b>`, "sucesso");
                    
                    camadaPoligono = L.geoJSON(featurePoligonoEncontrado, {
                        style: { color: "#28a745", weight: 2, fillOpacity: 0.2 }
                    }).addTo(map);
                    
                    map.fitBounds(camadaPoligono.getBounds());
                } else {
                    mostrarResultado("Endereço localizado no mapa, mas ele cai fora das áreas de abrangência cadastradas no sistema.", "erro");
                }
            })
            .catch(error => {
                mostrarResultado(error.message, "erro");
            });
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>

</body>
</html>
