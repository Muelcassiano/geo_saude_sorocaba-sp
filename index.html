<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Endereço por UBS - Sorocaba</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .busca-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; white-space: nowrap; }
        button:hover { background-color: #0056b3; }
        
        #map { height: 500px; width: 100%; margin-top: 20px; border-radius: 4px; display: none; z-index: 1; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 4px; font-weight: bold; display: none; }
        
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }

        /* Estilo do Rótulo do QGIS (Texto com Halo/Contorno Branco) */
        .rotulo-ubs {
            background: none;
            border: none;
            box-shadow: none;
            font-size: 16px;
            font-weight: 900;
            color: #111;
            text-align: center;
            /* Cria o contorno branco perfeitamente legível */
            text-shadow: 
                -2px -2px 0 #FFF, 2px -2px 0 #FFF, 
                -2px 2px 0 #FFF, 2px 2px 0 #FFF,
                -1px 0px 0 #FFF, 1px 0px 0 #FFF,
                0px -1px 0 #FFF, 0px 1px 0 #FFF;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Descubra sua UBS - Sorocaba</h2>
    <p>Digite seu logradouro (Ex: Americo Figueiredo):</p>
    
    <div class="busca-box">
        <input type="text" id="endereco" placeholder="Rua, avenida, Sorocaba - SP">
        <button onclick="buscarEndereco()">Buscar</button>
    </div>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<script>
    let dadosUbs = null;
    let map = null;
    let camadasBusca = L.layerGroup();
    let camadasPoligonos = L.layerGroup(); 

    // Permite buscar ao pressionar a tecla "Enter"
    document.getElementById('endereco').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            buscarEndereco();
        }
    });

    function initMap(lat, lon, zoom = 13) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            camadasBusca.addTo(map);
            camadasPoligonos.addTo(map);
        }
    }

    // Carrega a base de dados
    fetch('abrangencia_ubs_sorocaba.json')
        .then(response => {
            if (!response.ok) throw new Error("Falha ao carregar o arquivo.");
            return response.json();
        })
        .then(data => { dadosUbs = data; })
        .catch(error => mostrarResultado("Erro ao carregar banco de dados das UBS.", "erro"));

    function buscarEndereco() {
        let enderecoDigitado = document.getElementById('endereco').value.trim();
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um logradouro.", "erro");
            return;
        }

        // Garante que a busca fique focada em Sorocaba
        const buscaFinal = enderecoDigitado.toLowerCase().includes("sorocaba") ? enderecoDigitado : `${enderecoDigitado}, Sorocaba, SP`;
        mostrarResultado("Analisando malha viária...", "info");

        // Limit=10 é crucial para acharmos os vários segmentos de uma avenida longa
        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaFinal)}&limit=10&polygon_geojson=1`;

        fetch(urlGeocode)
            .then(response => response.json())
            .then(resultados => {
                if (resultados.length === 0) throw new Error("Logradouro não encontrado.");

                camadasBusca.clearLayers();
                camadasPoligonos.clearLayers();

                // --------------------------------------------------------------------------------
                // ALGORITMO DE FILTRAGEM: Prioriza Vias (highways) e ignora Empreendimentos
                // --------------------------------------------------------------------------------
                let alvosGeograficos = [];
                let viasEncontradas = resultados.filter(r => r.class === 'highway');

                if (viasEncontradas.length > 0) {
                    // Se achou pelo menos um trecho de rua, pega o nome oficial (Ex: "Avenida Doutor Américo Figueiredo")
                    let nomeOficialDaRua = viasEncontradas[0].name;
                    
                    // Agrupa TODOS os trechos que compõem essa rua específica (a costura)
                    alvosGeograficos = viasEncontradas.filter(r => r.name === nomeOficialDaRua);
                } else {
                    // Se a pessoa digitou um bairro ou número exato que não classificou como 'highway'
                    alvosGeograficos = [resultados[0]];
                }
                // --------------------------------------------------------------------------------

                // Centraliza o mapa no primeiro segmento encontrado
                initMap(parseFloat(alvosGeograficos[0].lat), parseFloat(alvosGeograficos[0].lon));

                let ubsEncontradasFeatures = [];
                let ubsNomes = new Set();
                let boundsGeral = L.latLngBounds();

                // Itera sobre todos os segmentos da rua encontrados (para avenidas longas)
                alvosGeograficos.forEach(alvo => {
                    const formatoGeoJson = alvo.geojson;
                    const featureElemento = turf.feature(formatoGeoJson);

                    // Desenha o segmento da via buscada (em vermelho)
                    const linhaNoMapa = L.geoJSON(formatoGeoJson, {
                        style: { color: "#ff0000", weight: 4 },
                        pointToLayer: (feature, latlng) => L.marker(latlng)
                    }).addTo(camadasBusca);
                    
                    boundsGeral.extend(linhaNoMapa.getBounds());

                    // Verifica em quais polígonos de UBS este segmento da via cruza
                    turf.featureEach(dadosUbs, function (ubsPoligono) {
                        if (turf.booleanIntersects(featureElemento, ubsPoligono)) {
                            let nomeUbs = ubsPoligono.properties.UBS;
                            
                            // Evita adicionar a mesma UBS duas vezes caso múltiplos segmentos cruzem nela
                            if (!ubsNomes.has(nomeUbs)) {
                                ubsNomes.add(nomeUbs);
                                ubsEncontradasFeatures.push(ubsPoligono);
                            }
                        }
                    });
                });

                // Se encontrou alguma área de abrangência
                if (ubsEncontradasFeatures.length > 0) {
                    let htmlResultado = `Logradouro identificado! Cruza a área de abrangência de <b>${ubsEncontradasFeatures.length}</b> UBS(s):<br><br>`;
                    
                    ubsEncontradasFeatures.forEach(feature => {
                        let nomeUbs = feature.properties.UBS;
                        htmlResultado += `📍 UBS ${nomeUbs}<br>`;
                        
                        // Desenha o polígono da UBS (verde translúcido)
                        const poliLayer = L.geoJSON(feature, {
                            style: { color: "#28a745", weight: 2, fillOpacity: 0.15 }
                        }).addTo(camadasPoligonos);
                        
                        boundsGeral.extend(poliLayer.getBounds());

                        // ------------------------------------------------------------------------
                        // INCLUSÃO DO RÓTULO (ESTILO QGIS) NO CENTRO DO POLÍGONO
                        // ------------------------------------------------------------------------
                        try {
                            // Encontra o "centro de massa" do polígono para ancorar o texto
                            let centro = turf.centerOfMass(feature);
                            let coords = centro.geometry.coordinates;
                            
                            L.marker([coords[1], coords[0]], {
                                icon: L.divIcon({
                                    className: 'rotulo-ubs',
                                    html: `<div>UBS ${nomeUbs.toUpperCase()}</div>`,
                                    iconSize: [150, 40],
                                    iconAnchor: [75, 20] // Centraliza o texto no ponto exato
                                }),
                                interactive: false // Para o texto não bloquear cliques no mapa
                            }).addTo(camadasPoligonos);
                        } catch (e) {
                            console.warn("Não foi possível calcular o centro do rótulo para a UBS:", nomeUbs);
                        }
                        // ------------------------------------------------------------------------
                    });

                    if (ubsEncontradasFeatures.length > 1) {
                         htmlResultado += `<br><small><i>Nota: A via pesquisada cruza múltiplas regiões. Para saber a UBS exata, inclua a numeração no momento da busca no futuro.</i></small>`;
                    }

                    mostrarResultado(htmlResultado, "sucesso");
                    map.fitBounds(boundsGeral); // Dá o zoom perfeito enquadrando a via e os polígonos

                } else {
                    mostrarResultado("Logradouro localizado, mas fora das áreas cadastradas.", "erro");
                    map.fitBounds(boundsGeral);
                }
            })
            .catch(error => mostrarResultado(error.message, "erro"));
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>
</body>
</html>
