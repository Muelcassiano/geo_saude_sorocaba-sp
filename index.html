    function selecionarLogradouroLocal(opcao) {
        const lotesDaRua = opcao.lotes;
        const loteReferencia = lotesDaRua[0];
        const coords = getSafeCoord(loteReferencia);
        const latCentro = coords[1];
        const lonCentro = coords[0];
        const nomeRua = loteReferencia.properties[keyEndereco];
        const ubsSet = new Set(lotesDaRua.map(lote => lote.properties[keyUbsLote]).filter(Boolean).map(ubs => ubs.trim().toLowerCase()));

        initMap(latCentro, lonCentro);
        const bairroId = `bairro-selecionado-${++contadorCep}`;
        const cepId = `cep-selecionado-${contadorCep}`;

        const bairrosIniciais = obterBairrosSincronos(nomeRua, lotesDaRua);
        const ruaNorm = normalizarApenasRua(nomeRua);
        const cepCache = cacheCepsPorLogradouro.get(ruaNorm);
        const cepInicialConfirmado = (cepCache && cepCache !== 'VARIA') ? formatarCep(cepCache) : null;
        const infoBairros = formatarExibicaoBairros(bairrosIniciais, nomeRua, cepInicialConfirmado, cepCache === 'VARIA');
        const cepFinalInicial = cepInicialConfirmado || infoBairros.cepTexto;

        const popupHTML = `<b>Logradouro Encontrado:</b><br><b>${nomeRua.toUpperCase()}</b><br>${infoBairros.linhaPopup}<br><b>CEP: <span id="popup-${cepId}">${cepFinalInicial}</span></b>`;
        L.marker([latCentro, lonCentro]).addTo(camadasBusca).bindPopup(popupHTML).openPopup();

        let htmlResultado = `<b>Logradouro Encontrado:</b><br><b>${nomeRua.toUpperCase()}</b><br><span id="bloco-${bairroId}">${infoBairros.linhaHtml}</span><br><b>CEP: <span id="${cepId}">${cepFinalInicial}</span></b><br><br>`;
        htmlResultado += ubsSet.size > 0 ? `Atravessa a área de abrangência de <b>${ubsSet.size}</b> UBS(s):<br><br>` : 'Endereço localizado, mas sem região de UBS atrelada no momento.';
        const boundsGeral = L.latLngBounds([[latCentro, lonCentro]]);
        if (dadosUbs && ubsSet.size > 0) {
            turf.featureEach(dadosUbs, ubsPoligono => {
                const nomeUbs = (ubsPoligono.properties.UBS || '').trim();
                if (!ubsSet.has(nomeUbs.toLowerCase())) return;
                const codigo = ubsPoligono.properties['Codigo microrregiao'] || ubsPoligono.properties.codigo_microrregiao || 'S/N';
                const enderecoUbs = (ubsPoligono.properties.END || '').replace(/(\r\n|\n|\r)/gm, ' ');
                const horarioUbs = (ubsPoligono.properties.Horario || '').replace(/(\r\n|\n|\r)/gm, ' ');
                const argsPopup = `'${nomeUbs.replace(/'/g, "\\'")}', '${enderecoUbs.replace(/'/g, "\\'")}', '${horarioUbs.replace(/'/g, "\\'")}'`;
                htmlResultado += `<div class="ubs-item">📍 <span class="ubs-clickable" onclick="abrirPopupUbs(${argsPopup})">UBS ${nomeUbs} - Cod. Microrregião (<b>${codigo}</b>)</span></div>`;
                const camada = L.geoJSON(ubsPoligono, { style: { color: '#10b981', weight: 2.5, fillOpacity: 0.12 } }).addTo(camadasPoligonos);
                boundsGeral.extend(camada.getBounds());
                try {
                    const centroide = turf.centroid(ubsPoligono).geometry.coordinates;
                    L.marker([centroide[1], centroide[0]], {
                        icon: L.divIcon({ className: 'rotulo-ubs', html: `<div>UBS ${nomeUbs.toUpperCase()}</div>`, iconSize: [160, 40], iconAnchor: [80, 20] }),
                        interactive: false
                    }).addTo(camadasPoligonos);
                } catch (e) {}
            });
            htmlResultado += `<br><small style="font-weight:normal; opacity:0.85;"><i>${ubsSet.size > 1 ? 'Nota: Esta via abrange múltiplas regiões.<br>Para saber a UBS exata, inclua o número do imóvel.' : 'Nota: Quer saber o endereço? clique na sua UBS'}</i></small>`;
        }
        mostrarResultado(htmlResultado, ubsSet.size > 0 ? 'sucesso' : 'erro');

        if (infoBairros.abrirModalAuto) {
            abrirModalBairros(nomeRua, bairrosIniciais);
        }

        obterDadosLogradouro(nomeRua, lotesDaRua, (dados) => {
            if (!dados || !dados.bairros || dados.bairros.length === 0) return;
            const bairrosAtualizados = dados.bairros;
            ultimosBairrosEncontrados = bairrosAtualizados;
            ultimoLogradouroBairros = nomeRua;

            const cepFinal = dados.cep
                ? formatarCep(dados.cep)
                : (dados.variaPorNumero || bairrosAtualizados.length >= 3
                    ? 'Varia por trecho/numeração (informe o número para consultar)'
                    : (bairrosAtualizados.length === 2
                        ? 'Varia por trecho (consulte com o número do imóvel)'
                        : 'Consulte informando o número do imóvel'));

            const infoAtualizada = formatarExibicaoBairros(bairrosAtualizados, nomeRua, dados.cep, dados.variaPorNumero);

            const elCep = document.getElementById(cepId);
            if (elCep) elCep.textContent = cepFinal;
            const elCepPopup = document.getElementById(`popup-${cepId}`);
            if (elCepPopup) elCepPopup.textContent = cepFinal;

            const blocoBairro = document.getElementById(`bloco-${bairroId}`);
            if (blocoBairro) blocoBairro.innerHTML = infoAtualizada.linhaHtml;

            const popupAtualizado = `<b>Logradouro Encontrado:</b><br><b>${nomeRua.toUpperCase()}</b><br>${infoAtualizada.linhaPopup}<br><b>CEP: ${cepFinal}</b>`;
            camadasBusca.eachLayer(layer => { if (layer.getPopup) layer.setPopupContent(popupAtualizado); });

            const modalEl = document.getElementById('modal-bairros');
            if (modalEl && modalEl.style.display === 'flex' && normalizarApenasRua(ultimoLogradouroBairros) === normalizarApenasRua(nomeRua)) {
                abrirModalBairros(nomeRua, bairrosAtualizados);
            }
        });

        if (boundsGeral.isValid()) map.fitBounds(boundsGeral, { padding: [30, 30] });
        restaurarBotaoBusca();
    }

    function obterLotesCorrespondentes(busca) {
        const correspondencias = [];
        for (const [chave, lotes] of indexLotesPorRua.entries()) {
            const pontuacao = pontuarNomeRua(chave, busca);
            if (pontuacao >= 0) correspondencias.push({ chave, lotes, pontuacao });
        }
        return correspondencias.sort((a, b) => b.pontuacao - a.pontuacao);
    }

    function formatarCep(cep) {
        if (!cep) return '';
        const numeros = String(cep).replace(/\D/g, '');
        return numeros.length === 8 ? `${numeros.slice(0, 5)}-${numeros.slice(5)}` : String(cep);
    }

    function buscarCepPorCoordenada(lat, lon, nomeRua, aoEncontrar) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}&zoom=18&accept-language=pt-BR&email=geosaude.sorocaba.app@gmail.com`;
        const cepValido = cep => /^\d{5}-?\d{3}$/.test(String(cep || '').trim());
        const buscarNoViaCep = () => fetch(`https://viacep.com.br/ws/SP/Sorocaba/${encodeURIComponent(nomeRua)}/json/`)
            .then(res => res.ok ? res.json() : [])
            .then(resultados => {
                if (!Array.isArray(resultados)) return null;
                const resultadoRua = resultados.find(item => pontuarNomeRua(item.logradouro, nomeRua) >= 0 && cepValido(item.cep));
                return resultadoRua ? resultadoRua.cep : null;
            })
            .catch(() => null);
        const buscarNoNominatim = () => fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=10&accept-language=pt-BR&email=geosaude.sorocaba.app@gmail.com&q=${encodeURIComponent(`${nomeRua}, Sorocaba, SP`)}`)
            .then(res => res.ok ? res.json() : [])
            .then(resultados => {
                const resultadoRua = resultados.find(item => pontuarNomeRua(obterNomeRua(item), nomeRua) >= 0 && cepValido(item.address && item.address.postcode));
                return resultadoRua && resultadoRua.address ? resultadoRua.address.postcode : null;
            })
            .catch(() => null);

        fetch(url).then(res => res.ok ? res.json() : null).then(data => {
            const nomeRetornado = data && data.address ? (data.address.road || '') : '';
            const cep = data && data.address ? data.address.postcode : null;
            if (nomeRetornado && pontuarNomeRua(nomeRetornado, nomeRua) >= 0 && cepValido(cep)) return cep;
            return buscarNoViaCep().then(cepViaCep => cepViaCep || buscarNoNominatim());
        }).then(cepEncontrado => aoEncontrar(cepEncontrado || null)).catch(() => aoEncontrar(null));
    }

    function initMap(lat, lon, zoom = 13) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            camadasBusca.addTo(map);
            camadasPoligonos.addTo(map);
        }
        setTimeout(() => { map.invalidateSize(); }, 200);
    }

    function gerarPopupNominatim(resultadoItem, numeroBuscado, cepInformado = null) {
        let road = resultadoItem.address ? (resultadoItem.address.road || resultadoItem.address.pedestrian || resultadoItem.address.square || resultadoItem.address.suburb || resultadoItem.name) : (resultadoItem.name || 'Logradouro');
        let cep = formatarCep(cepInformado) || (resultadoItem.address ? formatarCep(resultadoItem.address.postcode) : '');
        let bairro = extrairBairroNominatim(resultadoItem.address);
        let numTexto = numeroBuscado ? `, ${numeroBuscado}` : '';
        return `<b>Logradouro Encontrado:</b><br><b>${road.toUpperCase()}${numTexto}</b><br>${formatarLinhaLocalizacao(bairro)}<br><b>CEP: ${cep || 'não localizado'}</b>`;
    }

    function calcularExtensaoDentro(linhaString, poligono) {
        let comprimentoDentro = 0;
        let lines = [];
        if (linhaString.geometry.type === "LineString") { lines.push(linhaString); } 
        else if (linhaString.geometry.type === "MultiLineString") {
            linhaString.geometry.coordinates.forEach(coords => lines.push(turf.lineString(coords)));
        } else { return 999; }

        lines.forEach(linha => {
            let pedacos = turf.lineChunk(linha, 0.005, {units: 'kilometers'});
            try {
                turf.featureEach(pedacos, function(pedaco) {
                    let tamanho = turf.length(pedaco, {units: 'kilometers'});
                    let ponto = turf.along(pedaco, tamanho / 2, {units: 'kilometers'});
                    if (turf.booleanPointInPolygon(ponto, poligono)) comprimentoDentro += tamanho * 1000;
                });
            } catch(e){}
        });
        return comprimentoDentro;
    }

    function getSafeCoord(feature) {
        if (feature.geometry.type === "Point") return feature.geometry.coordinates;
        if (feature.geometry.type === "MultiPoint") return feature.geometry.coordinates[0];
        return turf.centroid(feature).geometry.coordinates;
    }

    function buscarLoteExatoOuAproximado(ruaBuscadaTexto, numeroBuscado) {
        let ruaNorm = normalizarApenasRua(ruaBuscadaTexto);
        let lotesDaRua = indexLotesPorRua.get(ruaNorm);
        
        if (!lotesDaRua) {
            for (let [chave, lotes] of indexLotesPorRua.entries()) {
                if (chave.includes(ruaNorm) || ruaNorm.includes(chave)) {
                    lotesDaRua = lotes;
                    break;
                }
            }
        }

        if (!lotesDaRua || lotesDaRua.length === 0) return null;
        let nomeOficialRuaLote = lotesDaRua[0].properties[keyEndereco];

        let exato = lotesDaRua.find(l => l.properties[keyNumero] !== null && parseInt(l.properties[keyNumero]) === numeroBuscado);
        if (exato) return { feature: exato, tipo: 'exato', nome: nomeOficialRuaLote, refFeatureUbsLote: exato };
        let comNumeros = lotesDaRua.filter(l => l.properties[keyNumero] !== null && !isNaN(parseInt(l.properties[keyNumero])));
        if (comNumeros.length === 0) {
            return { feature: lotesDaRua[0], tipo: 'aproximado_rua', nome: nomeOficialRuaLote, refFeatureUbsLote: lotesDaRua[0] };
        }

        comNumeros.sort((a, b) => parseInt(a.properties[keyNumero]) - parseInt(b.properties[keyNumero]));
        let menor = null, maior = null;

        for(let l of comNumeros) {
            let num = parseInt(l.properties[keyNumero]);
            if(num <= numeroBuscado) menor = l;
            if(num >= numeroBuscado && !maior) maior = l;
        }

        if (menor && maior) {
            if (menor === maior) return { feature: menor, tipo: 'aproximado_vizinho', nome: nomeOficialRuaLote, refFeatureUbsLote: menor };
            let p1 = getSafeCoord(menor);
            let p2 = getSafeCoord(maior);
            let midpoint = turf.midpoint(turf.point(p1), turf.point(p2));
            return { feature: midpoint, tipo: 'interpolado', nome: nomeOficialRuaLote, refFeatureUbsLote: menor };
        } else if (menor || maior) {
            let vizinhoUnico = menor || maior;
            return { feature: vizinhoUnico, tipo: 'aproximado_vizinho', nome: nomeOficialRuaLote, refFeatureUbsLote: vizinhoUnico };
        }
        return null;
    }

    function buscarEndereco() {
        let enderecoDigitado = document.getElementById('endereco').value.trim();
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um logradouro.", "erro");
            return;
        }
        
        const btn = document.getElementById('btnBuscar');
        btn.disabled = true;
        btn.innerText = "Buscando...";
        btn.style.backgroundColor = "#94a3b8";
        btn.style.cursor = "not-allowed";
        
        camadasBusca.clearLayers();
        camadasPoligonos.clearLayers();

        let cepParaBusca = null;
        const cepMatch = enderecoDigitado.match(/\b\d{5}-?\d{3}\b/);
        
        if (cepMatch) {
            cepParaBusca = cepMatch[0].replace(/\D/g, '');
        } else {
            const apenasNumeros = enderecoDigitado.replace(/\D/g, '');
            if (apenasNumeros.length === 8 && enderecoDigitado.length < 15 && !/[a-zA-Z]/.test(enderecoDigitado)) {
                cepParaBusca = apenasNumeros;
            }
        }

        if (cepParaBusca && cepParaBusca.length === 8) {
            mostrarResultado("Buscando logradouro via CEP...", "info");
            fetch(`https://viacep.com.br/ws/${cepParaBusca}/json/`)
                .then(res => res.json())
                .then(data => {
                    if (data.erro || !data.logradouro) {
                        let cepFormatado = cepParaBusca.substring(0, 5) + "-" + cepParaBusca.substring(5);
                        throw new Error(`Nenhum resultado para o CEP "${cepFormatado}". Você possui o nome do logradouro?`);
                    }
                    // Nota: O cepParaBusca é passado diretamente como cepInformado na execução da busca geográfica,
                    // sem poluir o cache global pelo nome do logradouro.
                    
                    const strSemCep = enderecoDigitado.replace(new RegExp(cepMatch ? cepMatch[0] : cepParaBusca, 'g'), '');
                    const todosNumerosOriginal = strSemCep.match(/\d+/g);
                    let numeroAdicional = "";
                    if (todosNumerosOriginal) {
                        const candidatosNum = todosNumerosOriginal.filter(n => n.length !== 8 && n.length < 5);
                        if (candidatosNum.length > 0) {
                            numeroAdicional = " " + candidatosNum[candidatosNum.length - 1];
                        }
                    }
        
                    executarBuscaGeografica(data.logradouro + numeroAdicional, cepParaBusca, data.bairro);
                }).catch((error) => {
                    const cepFormatado = cepParaBusca.substring(0, 5) + "-" + cepParaBusca.substring(5);
                    mostrarResultado(`Nenhum logradouro encontrado para o CEP "${cepFormatado}". Por favor, informe o nome do logradouro.`, "erro");
                    restaurarBotaoBusca();
                });
        } else {
            executarBuscaGeografica(enderecoDigitado);
        }
    }

    function executarBuscaGeografica(termoBusca, cepInformado = null, bairroInformado = null) {
        const buscaGeografica = termoBusca;
        const textoSemCep = termoBusca.replace(/\b\d{8}\b|\b\d{5}-?\d{3}\b/g, "").trim();
        const todosNumeros = textoSemCep.match(/\d+/g);
        const temNumero = todosNumeros !== null;
        const numeroBuscado = temNumero ? parseInt(todosNumeros[todosNumeros.length - 1]) : null;
        let ruaSemNumeroImovel = textoSemCep;
        if (temNumero) {
            const ultimoNumeroStr = todosNumeros[todosNumeros.length - 1];
            const idxUltimoNumero = textoSemCep.lastIndexOf(ultimoNumeroStr);
            ruaSemNumeroImovel = textoSemCep.substring(0, idxUltimoNumero) + textoSemCep.substring(idxUltimoNumero + ultimoNumeroStr.length);
        }

        // =====================================================================
        // ROTA A: Processamento Local em Memória
        // =====================================================================
        if (indexLotesPorRua.size > 0) {
            const correspondencias = obterLotesCorrespondentes(ruaSemNumeroImovel);
            const melhorPontuacao = correspondencias.length > 0 ? correspondencias[0].pontuacao : -1;
            const melhores = correspondencias.filter(item => item.pontuacao === melhorPontuacao);
            let lotesDaRua = melhores.length > 0 ? melhores[0].lotes : null;

            if (melhores.length > 1 || (melhorPontuacao < 1000 && correspondencias.length > 1)) {
                const opcoes = (melhores.length > 1 ? melhores : correspondencias.slice(0, 30)).map(item => {
                    const loteRef = item.lotes && item.lotes[0];
                    const coords = loteRef ? getSafeCoord(loteRef) : null;
                    const chaveCoord = coords ? `${Number(coords[1]).toFixed(4)},${Number(coords[0]).toFixed(4)}` : null;
                    return {
                        nome: item.lotes[0].properties[keyEndereco],
                        bairro: (chaveCoord && cacheBairros.get(chaveCoord)) || '',
                        busca: item.lotes[0].properties[keyEndereco],
                        lotes: item.lotes
                    };
                });
                const nomesUnicos = [...new Map(opcoes.map(opcao => [opcao.nome, opcao])).values()];
                mostrarOpcoesLogradouro(nomesUnicos, opcao => {
                    if (temNumero && numeroBuscado) {
                        executarBuscaGeografica(`${opcao.nome} ${numeroBuscado}`, cepInformado, bairroInformado);
                    } else {
                        selecionarLogradouroLocal(opcao);
                    }
                });
                restaurarBotaoBusca();
                return;
            }

            if (lotesDaRua && lotesDaRua.length > 0) {
                if (temNumero) {
                    let resultadoLote = buscarLoteExatoOuAproximado(ruaSemNumeroImovel, numeroBuscado);
                    if (resultadoLote) {
                        mostrarResultado("Processando localização na base oficial do município...", "info");
                        let nomeDaUbsAtribuidaNoLote = resultadoLote.refFeatureUbsLote.properties[keyUbsLote];
                        let coords = getSafeCoord(resultadoLote.feature);
                        let latCentro = coords[1], lonCentro = coords[0];
                        let chaveRua = normalizarApenasRua(resultadoLote.nome);
                        let chaveCoord = `${Number(latCentro).toFixed(4)},${Number(lonCentro).toFixed(4)}`;
                        let chaveRuaNumero = `${chaveRua}#${numeroBuscado}`;

                        let bairroInicial = bairroInformado || cacheBairros.get(chaveRuaNumero) || cacheBairros.get(chaveCoord) || '';
                        let cepResultadoInicial = formatarCep(cepInformado) || formatarCep(cacheCeps.get(chaveRuaNumero)) || formatarCep(cacheCeps.get(chaveCoord)) || '';
                        
                        let cepResultadoId = `cep-resultado-${++contadorCep}`;
                        let bairroResultadoId = `bairro-resultado-${contadorCep}`;
                        let tipoTexto = resultadoLote.tipo === 'exato' ? '' : '<br><small style="font-weight:normal; opacity: 0.85;"><i>(A numeração exata não consta no mapeamento oficial. A localização foi aproximada de forma inteligente.)</i></small>';

                        let textoBairroHtml = bairroInicial ? formatarLinhaLocalizacao(bairroInicial) : `<span id="${bairroResultadoId}">localizando bairro...</span>`;
                        let textoCepHtml = cepResultadoInicial ? cepResultadoInicial : `<span id="${cepResultadoId}">consultando...</span>`;

                        let popupHTML = `<b>Logradouro Encontrado:</b><br><b>${resultadoLote.nome.toUpperCase()}, ${numeroBuscado}</b><br><span id="popup-${bairroResultadoId}">${bairroInicial ? formatarLinhaLocalizacao(bairroInicial) : 'localizando bairro...'}</span><br><b>CEP: <span id="popup-${cepResultadoId}">${cepResultadoInicial || 'consultando...'}</span></b>${tipoTexto}`;
                        
                        initMap(latCentro, lonCentro);
                        L.marker([latCentro, lonCentro]).addTo(camadasBusca).bindPopup(popupHTML).openPopup();

                        if (nomeDaUbsAtribuidaNoLote && dadosUbs) {
                            let ubsLimpa = nomeDaUbsAtribuidaNoLote.trim();
                            let htmlRes = `<b>Logradouro Encontrado:</b><br><b>${resultadoLote.nome.toUpperCase()}, ${numeroBuscado}</b><br><span id="bloco-${bairroResultadoId}">${textoBairroHtml}</span><br><b>CEP: ${cepResultadoInicial ? `<span id="${cepResultadoId}">${cepResultadoInicial}</span>` : textoCepHtml}</b><br><br>Este imóvel é atendido pela:<br><br>`;
                            turf.featureEach(dadosUbs, function (ubsPoligono) {
                                let nomePoligonoLimpo = ubsPoligono.properties.UBS ? ubsPoligono.properties.UBS.trim() : "";
                                if (nomePoligonoLimpo.toLowerCase() === ubsLimpa.toLowerCase()) {
                                    let codigo = ubsPoligono.properties['Codigo microrregiao'] || ubsPoligono.properties.codigo_microrregiao || "S/N";
                                    let endSeguro = (ubsPoligono.properties.END || "").replace(/(\r\n|\n|\r)/gm, " ");
                                    let horSeguro = (ubsPoligono.properties.Horario || "").replace(/(\r\n|\n|\r)/gm, " ");
                                    let argsCliq = `'${ubsLimpa.replace(/'/g, "\\'")}', '${endSeguro.replace(/'/g, "\\'")}', '${horSeguro.replace(/'/g, "\\'")}'`;

                                    htmlRes += `<div class="ubs-item">📍 <span class="ubs-clickable" onclick="abrirPopupUbs(${argsCliq})">UBS ${ubsLimpa} - Cod. Microrregião (<b>${codigo}</b>)</span></div>`;
                                    L.geoJSON(ubsPoligono, { style: { color: "#10b981", weight: 2.5, fillOpacity: 0.12 } }).addTo(camadasPoligonos);
                                    try {
                                        let centroid = turf.centroid(ubsPoligono);
                                        let coordsC = centroid.geometry.coordinates;
                                        L.marker([coordsC[1], coordsC[0]], {
                                            icon: L.divIcon({ className: 'rotulo-ubs', html: `<div>UBS ${ubsLimpa.toUpperCase()}</div>`, iconSize: [160, 40], iconAnchor: [80, 20] }),
                                            interactive: false
                                        }).addTo(camadasPoligonos);
                                    } catch (e) {}
                                }
                            });
                            htmlRes += `<br><small style="font-weight:normal; opacity:0.85;"><i>Nota: Quer saber o endereço? clique ou toque na sua UBS</i></small>`;
                            mostrarResultado(htmlRes, "sucesso");
                        } else {
                            mostrarResultado(`Endereço localizado, mas sem região de UBS atrelada no momento.`, "erro");
                        }
                        
                        map.setView([latCentro, lonCentro], 19);
                        restaurarBotaoBusca();

                        // Enriquecimento e sincronização em segundo plano garantindo elementos já presentes no DOM
                        buscarDadosLogradouro(latCentro, lonCentro, resultadoLote.nome, numeroBuscado, ({ cep, bairro }) => {
                            const cepFormatado = formatarCep(cepInformado) || formatarCep(cep) || cepResultadoInicial || 'não localizado';
                            const bairroFinal = bairroInformado || bairro || bairroInicial;
                            const linhaBairro = formatarLinhaLocalizacao(bairroFinal);

                            const popupAtualizado = `<b>Logradouro Encontrado:</b><br><b>${resultadoLote.nome.toUpperCase()}, ${numeroBuscado}</b><br>${linhaBairro}<br><b>CEP: ${cepFormatado}</b>${tipoTexto}`;
                            camadasBusca.eachLayer(layer => { if (layer.getPopup) layer.setPopupContent(popupAtualizado); });

                            const cepNoResultado = document.getElementById(cepResultadoId);
                            if (cepNoResultado) cepNoResultado.textContent = cepFormatado;

                            const bairroNoResultado = document.getElementById(bairroResultadoId);
                            if (bairroNoResultado) bairroNoResultado.textContent = linhaBairro;
                            const blocoBairro = document.getElementById(`bloco-${bairroResultadoId}`);
                            if (blocoBairro && bairroFinal) blocoBairro.innerHTML = linhaBairro;
                        });

                        return;
                    }
                } else {
                    mostrarResultado("Processando logradouro na base municipal...", "info");
                    let nomeOficialRuaLote = lotesDaRua[0].properties[keyEndereco];
                    let ruaNorm = normalizarApenasRua(nomeOficialRuaLote);
                    
                    let ubsSet = new Set();
                    lotesDaRua.forEach(l => {
                        let ubsL = l.properties[keyUbsLote];
                        if (ubsL) ubsSet.add(ubsL.trim().toLowerCase());
                    });
                    let middleLote = lotesDaRua[Math.floor(lotesDaRua.length / 2)];
                    let coords = getSafeCoord(middleLote);
                    let latCentro = coords[1], lonCentro = coords[0];

                    const cepResultadoId = `cep-resultado-${++contadorCep}`;
                    const bairroResultadoId = `bairro-resultado-${contadorCep}`;

                    // Obtém relação imediata de bairros conhecidos da via
                    const bairrosIniciais = obterBairrosSincronos(nomeOficialRuaLote, lotesDaRua);
                    const cepCache = cacheCepsPorLogradouro.get(ruaNorm);
                    const cepInicialConfirmado = cepInformado ? formatarCep(cepInformado) : ((cepCache && cepCache !== 'VARIA') ? formatarCep(cepCache) : null);
                    const infoBairros = formatarExibicaoBairros(bairrosIniciais, nomeOficialRuaLote, cepInicialConfirmado, cepCache === 'VARIA');
                    const cepFinalInicial = cepInicialConfirmado || infoBairros.cepTexto;

                    initMap(latCentro, lonCentro);
                    let popupHTML = `<b>Logradouro Encontrado:</b><br><b>${nomeOficialRuaLote.toUpperCase()}</b><br>${infoBairros.linhaPopup}<br><b>CEP: <span id="popup-${cepResultadoId}">${cepFinalInicial}</span></b>`;
                    L.marker([latCentro, lonCentro]).addTo(camadasBusca).bindPopup(popupHTML).openPopup();

                    if (ubsSet.size > 0 && dadosUbs) {
                        let htmlRes = `<b>Logradouro Encontrado:</b><br><b>${nomeOficialRuaLote.toUpperCase()}</b><br><span id="bloco-${bairroResultadoId}">${infoBairros.linhaHtml}</span><br><b>CEP: <span id="${cepResultadoId}">${cepFinalInicial}</span></b><br><br>Atravessa a área de abrangência de <b>${ubsSet.size}</b> UBS(s):<br><br>`;
                        let boundsGeral = L.latLngBounds();
                        boundsGeral.extend([latCentro, lonCentro]);
                        turf.featureEach(dadosUbs, function (ubsPoligono) {
                            let nomePoligonoLimpo = ubsPoligono.properties.UBS ? ubsPoligono.properties.UBS.trim() : "";
                            if (ubsSet.has(nomePoligonoLimpo.toLowerCase())) {
                                let codigo = ubsPoligono.properties['Codigo microrregiao'] || ubsPoligono.properties.codigo_microrregiao || "S/N";
                                let endSeguro = (ubsPoligono.properties.END || "").replace(/(\r\n|\n|\r)/gm, " ");
                                let horSeguro = (ubsPoligono.properties.Horario || "").replace(/(\r\n|\n|\r)/gm, " ");
                                let argsCliq = `'${nomePoligonoLimpo.replace(/'/g, "\\'")}', '${endSeguro.replace(/'/g, "\\'")}', '${horSeguro.replace(/'/g, "\\'")}'`;

                                htmlRes += `<div class="ubs-item">📍 <span class="ubs-clickable" onclick="abrirPopupUbs(${argsCliq})">UBS ${nomePoligonoLimpo} - Cod. Microrregião (<b>${codigo}</b>)</span></div>`;
                                let poliLayer = L.geoJSON(ubsPoligono, { style: { color: "#10b981", weight: 2.5, fillOpacity: 0.12 } }).addTo(camadasPoligonos);
                                boundsGeral.extend(poliLayer.getBounds());
                                try {
                                    let centroid = turf.centroid(ubsPoligono);
                                    let coordsC = centroid.geometry.coordinates;
                                    L.marker([coordsC[1], coordsC[0]], {
                                        icon: L.divIcon({ className: 'rotulo-ubs', html: `<div>UBS ${nomePoligonoLimpo.toUpperCase()}</div>`, iconSize: [160, 40], iconAnchor: [80, 20] }),
                                        interactive: false
                                    }).addTo(camadasPoligonos);
                                } catch (e) {}
                            }
                        });
                        if (ubsSet.size > 1) {
                            htmlRes += `<br><small style="font-weight:normal; opacity:0.85;"><i>Nota: Esta via abrange múltiplas regiões.<br>Para saber a UBS exata, inclua o número do imóvel.</i><br>📍 Quer saber o endereço? clique na UBS</small>`;
                        } else {
                            htmlRes += `<br><small style="font-weight:normal; opacity:0.85;"><i>Nota: Quer saber o endereço? clique na sua UBS</i></small>`;
                        }
                        mostrarResultado(htmlRes, "sucesso");
                        map.fitBounds(boundsGeral, { padding: [30, 30] });
                    } else {
                        mostrarResultado(`Endereço localizado, mas sem região de UBS atrelada no momento.`, "erro");
                        map.setView([latCentro, lonCentro], 15);
                    }
                    restaurarBotaoBusca();

                    if (infoBairros.abrirModalAuto) {
                        abrirModalBairros(nomeOficialRuaLote, bairrosIniciais);
                    }

                    // Enriquecimento assíncrono em segundo plano (ViaCEP / OSM)
                    obterDadosLogradouro(nomeOficialRuaLote, lotesDaRua, (dados) => {
                        if (!dados || !dados.bairros || dados.bairros.length === 0) return;
                        const bairrosAtualizados = dados.bairros;
                        ultimosBairrosEncontrados = bairrosAtualizados;
                        ultimoLogradouroBairros = nomeOficialRuaLote;

                        const cepFinal = cepInformado
                            ? formatarCep(cepInformado)
                            : (dados.cep
                                ? formatarCep(dados.cep)
                                : (dados.variaPorNumero || bairrosAtualizados.length >= 3
                                    ? 'Varia por trecho/numeração (informe o número para consultar)'
                                    : (bairrosAtualizados.length === 2
                                        ? 'Varia por trecho (consulte com o número do imóvel)'
                                        : 'Consulte informando o número do imóvel')));

                        const infoAtualizada = formatarExibicaoBairros(bairrosAtualizados, nomeOficialRuaLote, dados.cep, dados.variaPorNumero);

                        const popupAtualizado = `<b>Logradouro Encontrado:</b><br><b>${nomeOficialRuaLote.toUpperCase()}</b><br>${infoAtualizada.linhaPopup}<br><b>CEP: ${cepFinal}</b>`;
                        camadasBusca.eachLayer(layer => { if (layer.getPopup) layer.setPopupContent(popupAtualizado); });

                        const cepNoResultado = document.getElementById(cepResultadoId);
                        if (cepNoResultado) cepNoResultado.textContent = cepFinal;
                        const elCepPopup = document.getElementById(`popup-${cepResultadoId}`);
                        if (elCepPopup) elCepPopup.textContent = cepFinal;

                        const blocoBairro = document.getElementById(`bloco-${bairroResultadoId}`);
                        if (blocoBairro) blocoBairro.innerHTML = infoAtualizada.linhaHtml;

                        const modalEl = document.getElementById('modal-bairros');
                        if (modalEl && modalEl.style.display === 'flex' && normalizarApenasRua(ultimoLogradouroBairros) === normalizarApenasRua(nomeOficialRuaLote)) {
                            abrirModalBairros(nomeOficialRuaLote, bairrosAtualizados);
                        }
                    });

                    return;
                }
            }
        }

        // =====================================================================
        // ROTA B: FALLBACK via Nominatim
        // =====================================================================
        const buscaFinal = termoBusca.toLowerCase().includes("sorocaba") ? termoBusca : `${termoBusca}, Sorocaba, SP`;
        mostrarResultado("Consultando base da rede viária integral...", "info");

        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&polygon_geojson=1&q=${encodeURIComponent(buscaFinal)}&limit=5&accept-language=pt-BR&email=geosaude.sorocaba.app@gmail.com`;
        fetch(urlGeocode)
            .then(res => { if (!res.ok) throw new Error(`Erro de rede.`); return res.json(); })
            .then(resultados => {
                if (resultados.length === 0) throw new Error("Endereço não encontrado na base de dados global.");

                const nomesEncontrados = [...new Map(resultados
                    .map(resultado => ({
                        resultado,
                        nome: obterNomeRua(resultado),
                        bairro: extrairBairroNominatim(resultado.address)
                    }))
                    .filter(item => item.nome)
                    .map(item => [normalizarApenasRua(item.nome), item])).values()];
                const buscaTemCep = /\b\d{5}-?\d{3}\b|\b\d{8}\b/.test(buscaGeografica);
                if (!buscaTemCep && nomesEncontrados.length > 1) {
                    mostrarOpcoesLogradouro(nomesEncontrados, opcao => {
                        const bairro = opcao.bairro ? `, ${opcao.bairro}` : '';
                        executarBuscaGeografica(`${opcao.nome}${bairro}`);
                    });
                    restaurarBotaoBusca();
                    return;
                }

                resultados = ordenarResultadosPorNome(resultados, buscaGeografica);
                let primeiroResultado = resultados[0];
                let displayName = primeiroResultado.display_name ? primeiroResultado.display_name.toUpperCase() : "";
                let inputOriginal = document.getElementById('endereco').value.trim().toUpperCase();

                // Tratamento específico de CEPs direcionando incorretamente para RUA ESPERANCA/JD
                if (displayName.includes("ESPERANCA") || displayName.includes("ESPERANÇA")) {
                    if (!inputOriginal.includes("ESPERANCA") && !inputOriginal.includes("ESPERANÇA")) {
                        let cepMatchErro = inputOriginal.match(/\d{5}-?\d{3}/) || inputOriginal.match(/\b\d{8}\b/);
                        if (cepMatchErro) {
                            let cepStr = cepMatchErro[0].replace("-", "");
                            let cepFormatado = cepStr.substring(0, 5) + "-" + cepStr.substring(5);
                            throw new Error(`Nenhum resultado para o CEP "${cepFormatado}". Você possui o nome do logradouro?`);
                        } else {
                            throw new Error("Endereço não encontrado de forma precisa na região.");
                        }
                    }
                }

                let viasEncontradas = resultados.filter(r => r.class === 'highway' || r.type === 'residential');
                let nomeOficial = viasEncontradas.length > 0 && viasEncontradas[0].address && viasEncontradas[0].address.road 
                                  ? viasEncontradas[0].address.road 
                                  : (resultados[0].address && resultados[0].address.road ? resultados[0].address.road : (viasEncontradas.length > 0 ? viasEncontradas[0].name : resultados[0].name));
                
                let latCentro = parseFloat(resultados[0].lat);
                let lonCentro = parseFloat(resultados[0].lon);
                let popupHTML = gerarPopupNominatim(primeiroResultado, numeroBuscado, cepInformado);
                if (temNumero) {
                    renderizarMapaLinhaUbs(latCentro, lonCentro, true, popupHTML, null, resultados, nomeOficial, cepInformado);
                    restaurarBotaoBusca();
                } else {
                    const urlOverpass = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(`[out:json][timeout:15];area["name"="Sorocaba"]->.a;way(area.a)["name"="${nomeOficial}"];out geom;`)}`;
                    fetch(urlOverpass)
                        .then(res => res.ok ? res.json() : { elements: [] })
                        .then(overpassData => {
                            renderizarMapaLinhaUbs(latCentro, lonCentro, false, popupHTML, overpassData, resultados, nomeOficial, cepInformado);
                            restaurarBotaoBusca();
                        })
                        .catch(() => {
                            renderizarMapaLinhaUbs(latCentro, lonCentro, false, popupHTML, null, resultados, nomeOficial, cepInformado);
                            restaurarBotaoBusca();
                        });
                }
            })
            .catch(error => {
                if (error.message.includes("Você possui o nome do logradouro?")) {
                    mostrarResultado(error.message, "erro");
                } else {
                    mostrarResultado(`Ops! Ocorreu um erro: ${error.message}`, "erro");
                }
                restaurarBotaoBusca();
            });
    }

    function renderizarMapaLinhaUbs(latCentro, lonCentro, temNumero, popupHtmlText, overpassData, resultadosNominatim, nomeOficial, cepInformado = null) {
        initMap(latCentro, lonCentro);
        let ubsEncontradasFeatures = [];
        let ubsNomes = new Set();
        let boundsGeral = L.latLngBounds();
        const resultadoPrincipal = resultadosNominatim && resultadosNominatim[0];
        const bairroResultado = extrairBairroNominatim(resultadoPrincipal && resultadoPrincipal.address);
        const cepResultado = formatarCep(cepInformado) || (resultadoPrincipal && resultadoPrincipal.address ? formatarCep(resultadoPrincipal.address.postcode) : '');

        const chaveCoord = `${Number(latCentro).toFixed(4)},${Number(lonCentro).toFixed(4)}`;
        if (bairroResultado) {
            cacheBairros.set(chaveCoord, bairroResultado);
            salvarCacheBairros();
        }
        if (cepResultado) {
            cacheCeps.set(chaveCoord, cepResultado);
        }

        let popupInicial = popupHtmlText;
        let bairrosIniciaisRotaB = null;
        let infoBairrosIniciaisRotaB = null;
        if (!temNumero) {
            bairrosIniciaisRotaB = obterBairrosSincronos(nomeOficial, null);
            const ruaNorm = normalizarApenasRua(nomeOficial);
            const cepCache = cacheCepsPorLogradouro.get(ruaNorm);
            const cepInicialConfirmado = cepInformado ? formatarCep(cepInformado) : ((cepCache && cepCache !== 'VARIA') ? formatarCep(cepCache) : null);
            infoBairrosIniciaisRotaB = formatarExibicaoBairros(bairrosIniciaisRotaB, nomeOficial, cepInicialConfirmado, cepCache === 'VARIA');
            const cepFinalInicial = cepInicialConfirmado || infoBairrosIniciaisRotaB.cepTexto;
            popupInicial = `<b>Logradouro Encontrado:</b><br><b>${nomeOficial.toUpperCase()}</b><br>${infoBairrosIniciaisRotaB.linhaPopup}<br><b>CEP: ${cepFinalInicial}</b>`;
        }

        L.marker([latCentro, lonCentro]).addTo(camadasBusca).bindPopup(popupInicial).openPopup();
        boundsGeral.extend([latCentro, lonCentro]);

        function verificarPoligonosIntersectados(featureElemento) {
            if (dadosUbs) {
                turf.featureEach(dadosUbs, function (ubsPoligono) {
                    if (turf.booleanIntersects(featureElemento, ubsPoligono)) {
                        let extTotal = featureElemento.geometry.type.includes("Line") ? turf.length(featureElemento, {units: 'kilometers'}) * 1000 : 999;
                        let extDentro = calcularExtensaoDentro(featureElemento, ubsPoligono);
                        if (extDentro >= 15 || extTotal <= 15) {
                            let nomeUbs = ubsPoligono.properties.UBS;
                            if (nomeUbs && !ubsNomes.has(nomeUbs)) { ubsNomes.add(nomeUbs); ubsEncontradasFeatures.push(ubsPoligono); }
                        }
                    }
                });
            }
        }

        // 1. Sempre testa as coordenadas centrais do logradouro garantindo localização imediata
        let pontoTurf = turf.point([lonCentro, latCentro]);
        verificarPoligonosIntersectados(pontoTurf);

        // 2. Se for busca de via inteira (sem número), busca extensão completa via Overpass ou geometria Nominatim
        if (!temNumero) {
            let achouNoOverpass = false;
            if (overpassData && overpassData.elements && overpassData.elements.length > 0) {
                overpassData.elements.forEach(el => {
                    if (el.geometry && el.geometry.length > 1) {
                        achouNoOverpass = true;
                        let featureElemento = turf.lineString(el.geometry.map(pt => [pt.lon, pt.lat]));
                        const linhaNoMapa = L.polyline(el.geometry.map(pt => [pt.lat, pt.lon]), { color: "#ff2222", weight: 5, opacity: 0.85 }).addTo(camadasBusca);
                        boundsGeral.extend(linhaNoMapa.getBounds());
                        verificarPoligonosIntersectados(featureElemento);
                    }
                });
            }

            if (!achouNoOverpass && resultadosNominatim && nomeOficial) {
                let alvosGeograficos = resultadosNominatim.filter(r => r.name === nomeOficial || (r.address && r.address.road === nomeOficial)).slice(0, 50);
                if (alvosGeograficos.length === 0) alvosGeograficos = [resultadosNominatim[0]];
                alvosGeograficos.forEach(alvo => {
                    if (alvo.geojson) {
                        const featureElemento = turf.feature(alvo.geojson);
                        const linhaNoMapa = L.geoJSON(alvo.geojson, { style: { color: "#ff2222", weight: 5, opacity: 0.85 } }).addTo(camadasBusca);
                        boundsGeral.extend(linhaNoMapa.getBounds());
                        verificarPoligonosIntersectados(featureElemento);
                    }
                });
            }
        }

        // 3. Tolerância Inteligente: se nenhuma UBS foi intersectada diretamente (ex: via sobre a divisa de bairro ou margem de GPS),
        // atribui à UBS com polígono mais próximo dentro do município de Sorocaba
        if (ubsEncontradasFeatures.length === 0 && dadosUbs) {
            let ubsMaisProxima = null;
            let menorDistancia = Infinity;
            turf.featureEach(dadosUbs, function (ubsPoligono) {
                try {
                    let d = turf.pointToPolygonDistance(pontoTurf, ubsPoligono, {units: 'meters'});
                    if (d < menorDistancia) {
                        menorDistancia = d;
                        ubsMaisProxima = ubsPoligono;
                    }
                } catch(e) {
                    try {
                        let c = turf.centroid(ubsPoligono);
                        let d = turf.distance(pontoTurf, c, {units: 'meters'});
                        if (d < menorDistancia) {
                            menorDistancia = d;
                            ubsMaisProxima = ubsPoligono;
                        }
                    } catch(err) {}
                }
            });
            if (ubsMaisProxima && menorDistancia <= 800) {
                let nomeUbs = ubsMaisProxima.properties.UBS;
                if (nomeUbs && !ubsNomes.has(nomeUbs)) {
                    ubsNomes.add(nomeUbs);
                    ubsEncontradasFeatures.push(ubsMaisProxima);
                }
            }
        }

        if (ubsEncontradasFeatures.length > 0) {
            const bairroIdRotaB = `bairro-rotab-${++contadorCep}`;
            const cepIdRotaB = `cep-rotab-${contadorCep}`;

            let textoBairroInicial = temNumero ? formatarLinhaLocalizacao(bairroResultado) : (infoBairrosIniciaisRotaB ? infoBairrosIniciaisRotaB.linhaHtml : `<span id="${bairroIdRotaB}">localizando bairros da via...</span>`);
            let textoCepInicial = temNumero ? (cepResultado || 'não localizado') : (infoBairrosIniciaisRotaB ? (cepInformado ? formatarCep(cepInformado) : infoBairrosIniciaisRotaB.cepTexto) : `<span id="${cepIdRotaB}">consultando...</span>`);

            let htmlResultado = `<b>Logradouro Encontrado:</b><br><b>${nomeOficial.toUpperCase()}</b><br><span id="bloco-${bairroIdRotaB}">${textoBairroInicial}</span><br><b>CEP: <span id="${cepIdRotaB}">${textoCepInicial}</span></b><br><br>`;
            htmlResultado += temNumero ? `📍 <b>Numeração identificada geograficamente!</b><br>Este endereço pertence à área de atendimento da:<br><br>` : `Atravessa a área de abrangência de <b>${ubsEncontradasFeatures.length}</b> UBS(s):<br><br>`;
            
            ubsEncontradasFeatures.forEach(feature => {
                let nomeUbsLimpo = feature.properties.UBS ? feature.properties.UBS.trim() : "Desconhecida";
                let codigo = feature.properties['Codigo microrregiao'] || feature.properties.codigo_microrregiao || "S/N";
                let endSeguro = (feature.properties.END || "").replace(/(\r\n|\n|\r)/gm, " ");
                let horSeguro = (feature.properties.Horario || "").replace(/(\r\n|\n|\r)/gm, " ");
                let argsCliq = `'${nomeUbsLimpo.replace(/'/g, "\\'")}', '${endSeguro.replace(/'/g, "\\'")}', '${horSeguro.replace(/'/g, "\\'")}'`;

                htmlResultado += `<div class="ubs-item">📍 <span class="ubs-clickable" onclick="abrirPopupUbs(${argsCliq})">UBS ${nomeUbsLimpo} - Cod. Microrregião (<b>${codigo}</b>)</span></div>`;
                const poliLayer = L.geoJSON(feature, { style: { color: "#10b981", weight: 2.5, fillOpacity: 0.12 } }).addTo(camadasPoligonos);
                boundsGeral.extend(poliLayer.getBounds());

                try {
                    let centroid = turf.centroid(feature);
                    let coords = centroid.geometry.coordinates;
                    L.marker([coords[1], coords[0]], { icon: L.divIcon({ className: 'rotulo-ubs', html: `<div>UBS ${nomeUbsLimpo.toUpperCase()}</div>`, iconSize: [160, 40], iconAnchor: [80, 20] }), interactive: false }).addTo(camadasPoligonos);
                } catch (e) {}
            });
            if (!temNumero && ubsEncontradasFeatures.length > 1) {
                htmlResultado += `<br><small style="font-weight:normal; opacity:0.85;"><i>Nota: Esta via abrange múltiplas regiões.<br>Para saber a UBS exata, inclua o número do imóvel.</i><br>📍 Quer saber o endereço? clique na UBS</small>`;
            } else {
                htmlResultado += `<br><small style="font-weight:normal; opacity:0.85;"><i>Nota: Quer saber o endereço? clique na sua UBS</i></small>`;
            }

            mostrarResultado(htmlResultado, "sucesso");
            temNumero ? map.setView([latCentro, lonCentro], 19) : map.fitBounds(boundsGeral, { padding: [30, 30] });

            if (!temNumero && infoBairrosIniciaisRotaB && infoBairrosIniciaisRotaB.abrirModalAuto) {
                abrirModalBairros(nomeOficial, bairrosIniciaisRotaB);
            }

            if (!temNumero) {
                obterDadosLogradouro(nomeOficial, null, (dados) => {
                    if (!dados || !dados.bairros || dados.bairros.length === 0) return;
                    const bairros = dados.bairros;
                    ultimosBairrosEncontrados = bairros;
                    ultimoLogradouroBairros = nomeOficial;

                    const cepFinal = cepInformado
                        ? formatarCep(cepInformado)
                        : (dados.cep
                            ? formatarCep(dados.cep)
                            : (dados.variaPorNumero || bairros.length >= 3
                                ? 'Varia por trecho/numeração (informe o número para consultar)'
                                : (bairros.length === 2
                                    ? 'Varia por trecho (consulte com o número do imóvel)'
                                    : 'Consulte informando o número do imóvel')));

                    const infoBairros = formatarExibicaoBairros(bairros, nomeOficial, dados.cep, dados.variaPorNumero);

                    const elBairro = document.getElementById(bairroIdRotaB);
                    if (elBairro) elBairro.innerHTML = infoBairros.linhaHtml;
                    const blocoBairro = document.getElementById(`bloco-${bairroIdRotaB}`);
                    if (blocoBairro) blocoBairro.innerHTML = infoBairros.linhaHtml;

                    const elCep = document.getElementById(cepIdRotaB);
                    if (elCep) elCep.textContent = cepFinal;

                    const popupAtualizado = `<b>Logradouro Encontrado:</b><br><b>${nomeOficial.toUpperCase()}</b><br>${infoBairros.linhaPopup}<br><b>CEP: ${cepFinal}</b>`;
                    camadasBusca.eachLayer(layer => { if (layer.getPopup) layer.setPopupContent(popupAtualizado); });

                    const modalEl = document.getElementById('modal-bairros');
                    if (modalEl && modalEl.style.display === 'flex' && normalizarApenasRua(ultimoLogradouroBairros) === normalizarApenasRua(nomeOficial)) {
                        abrirModalBairros(nomeOficial, bairros);
                    }
                });
            }
        } else {
            mostrarResultado("Endereço localizado, mas não intercepta nenhuma área de UBS cadastrada.", "erro");
            boundsGeral.isValid() ? map.fitBounds(boundsGeral, { padding: [30, 30] }) : map.setView([latCentro, lonCentro], 15);
        }
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>
</body>
</html>
