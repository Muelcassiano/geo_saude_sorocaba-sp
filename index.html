<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Endereço por UBS - Sorocaba (SP)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f6f9; 
            color: #333;
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { margin-top: 0; color: #1e293b; font-size: 24px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 20px; }
        
        .busca-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #3b82f6; }
        button { 
            padding: 14px 28px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px; 
            white-space: nowrap; 
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        
        #map { 
            height: 55vh; 
            min-height: 350px;
            max-height: 600px;
            width: 100%; 
            margin-top: 20px; 
            border-radius: 8px; 
            display: none; 
            z-index: 1; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        #resultado { 
            margin-top: 20px; 
            padding: 18px; 
            border-radius: 6px; 
            font-weight: 600; 
            line-height: 1.5;
            display: none; 
            word-wrap: break-word;
        }
        
        .sucesso { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .erro { background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        .info { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        .rotulo-ubs {
            background: none;
            border: none;
            box-shadow: none;
            font-size: 14px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            text-shadow: 
                -2px -2px 0 #FFF, 2px -2px 0 #FFF, 
                -2px 2px 0 #FFF, 2px 2px 0 #FFF,
                -1px 0px 0 #FFF, 1px 0px 0 #FFF,
                0px -1px 0 #FFF, 0px 1px 0 #FFF;
        }

        /* Classes para a interação e Modal da UBS */
        .ubs-item { margin-bottom: 8px; }
        .ubs-clickable {
            cursor: pointer;
            text-decoration: underline;
            color: #065f46;
            transition: color 0.2s;
        }
        .ubs-clickable:hover { color: #047857; }
        
        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 2000;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #fff; padding: 25px; border-radius: 10px;
            width: 90%; max-width: 450px; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: #333; font-weight: normal; line-height: 1.6;
        }
        .modal-close {
            position: absolute; top: 12px; right: 18px;
            cursor: pointer; font-size: 22px; font-weight: bold; color: #94a3b8;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #ef4444; }
        .modal-titulo { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 10px; margin-top: 0;}
        .modal-endereco { margin-bottom: 15px; }
        .modal-horario { font-size: 15px; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .busca-box { flex-direction: column; }
            button { width: 100%; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Descubra sua UBS - Sorocaba (SP)</h2>
    <p>Digite seu logradouro (Exemplos: Avenida Itavuvu, Avenida Brasil 60 ou 18071650):</p>
    
    <div class="busca-box">
        <input type="text" id="endereco" placeholder="Rua, avenida, número, ou CEP">
        <button onclick="buscarEndereco()">Buscar</button>
    </div>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<div id="modal-ubs" class="modal-overlay" onclick="fecharModalFora(event)">
    <div class="modal-content">
        <span class="modal-close" onclick="fecharPopupUbs()">×</span>
        <h3 id="modal-titulo" class="modal-titulo"></h3>
        <div id="modal-endereco" class="modal-endereco"></div>
        <div id="modal-horario" class="modal-horario"></div>
    </div>
</div>

<script>
    let dadosUbs = null;
    let map = null;
    let camadasBusca = L.layerGroup();
    let camadasPoligonos = L.layerGroup(); 

    document.getElementById('endereco').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { buscarEndereco(); }
    });

    // Funções de tratamento de texto para o Modal
    function formatarEndereco(endStr) {
        if (!endStr) return "Endereço não disponível";
        let partes = endStr.split(",");
        
        // Remove acentos, passa para maiúsculo e adiciona negrito apenas no logradouro
        let logradouroSemAcento = partes[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
        partes[0] = `<b>${logradouroSemAcento}</b>`;
        
        return partes.join(",");
    }

    function formatarHorario(horStr) {
        if (!horStr) return "Horário não informado";
        
        // Regra para unidades mistas (UBS e PA)
        if (horStr.includes("PA -") && horStr.includes("UBS -")) {
            let partes = horStr.split("PA -");
            let ubsParte = partes[0].replace("UBS -", "").trim();
            let paParte = partes[1].trim();

            return `Horários Seg. à Sex:<br>
                    UBS - das ${ubsParte}<br>
                    PA - das ${paParte}<br><br>
                    Finais de Semana e Feriados:<br>
                    Urgência (PA) - das ${paParte}`;
        } else {
            // Regra padrão
            let horaLimpa = horStr.trim();
            if (!horaLimpa.toLowerCase().startsWith("das ")) {
                horaLimpa = "das " + horaLimpa;
            }
            return `Horários Seg. à Sex: ${horaLimpa}`;
        }
    }

    // Abertura e Fechamento do Modal
    function abrirPopupUbs(nome, endereco, horario) {
        document.getElementById('modal-titulo').innerText = `UBS ${nome}:`;
        document.getElementById('modal-endereco').innerHTML = formatarEndereco(endereco);
        document.getElementById('modal-horario').innerHTML = formatarHorario(horario);
        
        document.getElementById('modal-ubs').style.display = 'flex';
    }

    function fecharPopupUbs() {
        document.getElementById('modal-ubs').style.display = 'none';
    }

    function fecharModalFora(event) {
        if (event.target === document.getElementById('modal-ubs')) {
            fecharPopupUbs();
        }
    }

    // Inicialização do Mapa
    function initMap(lat, lon, zoom = 13) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], zoom);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            camadasBusca.addTo(map);
            camadasPoligonos.addTo(map);
        }
        setTimeout(() => { map.invalidateSize(); }, 200);
    }

    // Carregamento do JSON
    fetch('abrangencia_ubs_sorocaba.json')
        .then(response => {
            if (!response.ok) throw new Error("Falha ao carregar o arquivo abrangencia_ubs_sorocaba.json.");
            return response.json();
        })
        .then(data => { dadosUbs = data; })
        .catch(error => mostrarResultado("Erro ao carregar banco de dados das UBS. Verifique se o arquivo JSON está na mesma pasta.", "erro"));

    function formatarPopupInfo(resultadoItem) {
        let displayName = resultadoItem.display_name;
        let road = resultadoItem.address ? (resultadoItem.address.road || resultadoItem.address.pedestrian || resultadoItem.address.square) : null;
        
        if (road) {
            let regexRoad = new RegExp(road + "([, -]*)", 'i');
            displayName = displayName.replace(regexRoad, '');
            displayName = `<b>${road}</b>, ${displayName}`;
            displayName = displayName.replace(/^,\s*/, '');
        }
        return `<b>Localização Encontrada:</b><br>${displayName}`;
    }

    function calcularExtensaoDentro(linhaString, poligono) {
        let comprimentoDentro = 0;
        let lines = [];
        
        if (linhaString.geometry.type === "LineString") {
            lines.push(linhaString);
        } else if (linhaString.geometry.type === "MultiLineString") {
            linhaString.geometry.coordinates.forEach(coords => {
                lines.push(turf.lineString(coords));
            });
        } else { 
            return 999;
        }

        lines.forEach(linha => {
            let pedacos = turf.lineChunk(linha, 0.005, {units: 'kilometers'});
            turf.featureEach(pedacos, function(pedaco) {
                let tamanhoFragmento = turf.length(pedaco, {units: 'kilometers'});
                let pontoCentralDoFragmento = turf.along(pedaco, tamanhoFragmento / 2, {units: 'kilometers'});
                
                if (turf.booleanPointInPolygon(pontoCentralDoFragmento, poligono)) {
                    comprimentoDentro += tamanhoFragmento * 1000;
                }
            });
        });
        
        return comprimentoDentro;
    }

    function buscarEndereco() {
        let enderecoDigitado = document.getElementById('endereco').value.trim();
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um logradouro.", "erro");
            return;
        }

        const cepLimpo = enderecoDigitado.replace(/\D/g, '');
        const ehApenasCep = (cepLimpo.length === 8);

        if (ehApenasCep) {
            mostrarResultado("Buscando logradouro correspondente ao CEP informado...", "info");
            
            fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
                .then(res => res.json())
                .then(data => {
                    if (data.erro || !data.logradouro) {
                        throw new Error("Logradouro não encontrado para este CEP. Tentando busca direta...");
                    }
                    executarBuscaGeografica(data.logradouro);
                })
                .catch(err => {
                    executarBuscaGeografica(enderecoDigitado);
                });
        } else {
            executarBuscaGeografica(enderecoDigitado);
        }
    }

    function executarBuscaGeografica(termoBusca) {
        const textoSemCep = termoBusca.replace(/\b\d{8}\b|\b\d{5}-?\d{3}\b/g, "").trim();
        const temNumero = /\d+/.test(textoSemCep); 
        
        const buscaFinal = termoBusca.toLowerCase().includes("sorocaba") ? termoBusca : `${termoBusca}, Sorocaba, SP`;

        if (temNumero) {
            mostrarResultado("Localizando número exato e identificando sua UBS correspondente...", "info");
        } else {
            mostrarResultado("Mapeando malha viária completa e delimitando intersecções...", "info");
        }

        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(buscaFinal)}&limit=5&accept-language=pt-BR&email=geosaude.sorocaba.app@gmail.com`;

        fetch(urlGeocode)
            .then(response => {
                if (!response.ok) throw new Error(`Erro do servidor de mapas: ${response.status}`);
                return response.json();
            })
            .then(resultados => {
                if (resultados.length === 0) throw new Error("Endereço ou numeração não encontrados na base de dados. Verifique os dados inseridos.");

                let latCentro = parseFloat(resultados[0].lat);
                let lonCentro = parseFloat(resultados[0].lon);

                if (temNumero) {
                    return { resultados, temNumero, latCentro, lonCentro, overpassData: null };
                } else {
                    let viasEncontradas = resultados.filter(r => r.class === 'highway' || r.type === 'residential');
                    
                    let nomeOficial = "";
                    if (viasEncontradas.length > 0 && viasEncontradas[0].address && viasEncontradas[0].address.road) {
                        nomeOficial = viasEncontradas[0].address.road;
                        latCentro = parseFloat(viasEncontradas[0].lat);
                        lonCentro = parseFloat(viasEncontradas[0].lon);
                    } else if (resultados[0].address && resultados[0].address.road) {
                        nomeOficial = resultados[0].address.road;
                    } else {
                        nomeOficial = viasEncontradas.length > 0 ? viasEncontradas[0].name : resultados[0].name;
                    }

                    const overpassQuery = `[out:json][timeout:15];area["name"="Sorocaba"]->.a;way(area.a)["name"="${nomeOficial}"];out geom;`;
                    const urlOverpass = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`;

                    return fetch(urlOverpass)
                        .then(res => {
                            if (!res.ok) return { elements: [] };
                            return res.json();
                        })
                        .then(overpassData => {
                            return { resultados, temNumero, nomeOficial, latCentro, lonCentro, overpassData };
                        });
                }
            })
            .then(({ resultados, temNumero, nomeOficial, latCentro, lonCentro, overpassData }) => {
                camadasBusca.clearLayers();
                camadasPoligonos.clearLayers();
                initMap(latCentro, lonCentro);

                let ubsEncontradasFeatures = [];
                let ubsNomes = new Set();
                let boundsGeral = L.latLngBounds();

                const popupHtmlText = formatarPopupInfo(resultados[0]);
                L.marker([latCentro, lonCentro]).addTo(camadasBusca)
                    .bindPopup(popupHtmlText)
                    .openPopup();
                boundsGeral.extend([latCentro, lonCentro]);

                if (temNumero) {
                    let pontoTurf = turf.point([lonCentro, latCentro]);

                    if (dadosUbs) {
                        turf.featureEach(dadosUbs, function (ubsPoligono) {
                            if (turf.booleanPointInPolygon(pontoTurf, ubsPoligono)) {
                                let nomeUbs = ubsPoligono.properties.UBS;
                                if (!ubsNomes.has(nomeUbs)) {
                                    ubsNomes.add(nomeUbs);
                                    ubsEncontradasFeatures.push(ubsPoligono);
                                }
                            }
                        });
                    }
                } else {
                    let logradouroEncontradoNoOverpass = false;

                    if (overpassData && overpassData.elements && overpassData.elements.length > 0) {
                        overpassData.elements.forEach(el => {
                            if (el.geometry && el.geometry.length > 1) {
                                logradouroEncontradoNoOverpass = true;
                                let coordsTurf = el.geometry.map(pt => [pt.lon, pt.lat]);
                                let featureElemento = turf.lineString(coordsTurf);

                                let coordsLeaflet = el.geometry.map(pt => [pt.lat, pt.lon]);
                                const linhaNoMapa = L.polyline(coordsLeaflet, { color: "#ff2222", weight: 5, opacity: 0.85 }).addTo(camadasBusca);
                                boundsGeral.extend(linhaNoMapa.getBounds());

                                if (dadosUbs) {
                                    turf.featureEach(dadosUbs, function (ubsPoligono) {
                                        if (turf.booleanIntersects(featureElemento, ubsPoligono)) {
                                            let extensaoTotalDaVia = turf.length(featureElemento, {units: 'kilometers'}) * 1000;
                                            let extensaoInterna = calcularExtensaoDentro(featureElemento, ubsPoligono);
                                            
                                            if (extensaoInterna < 15 && extensaoTotalDaVia > 15) {
                                                return; 
                                            }

                                            let nomeUbs = ubsPoligono.properties.UBS;
                                            if (!ubsNomes.has(nomeUbs)) {
                                                ubsNomes.add(nomeUbs);
                                                ubsEncontradasFeatures.push(ubsPoligono);
                                            }
                                        }
                                    });
                                }
                            }
                        });
                    }
                    
                    if (!logradouroEncontradoNoOverpass) {
                        let alvosGeograficos = resultados.filter(r => r.name === nomeOficial).slice(0, 50);
                        if (alvosGeograficos.length === 0) alvosGeograficos = [resultados[0]];

                        alvosGeograficos.forEach(alvo => {
                            if (alvo.geojson) {
                                const featureElemento = turf.feature(alvo.geojson);
                                const linhaNoMapa = L.geoJSON(alvo.geojson, {
                                    style: { color: "#ff2222", weight: 5, opacity: 0.85 }
                                }).addTo(camadasBusca);
                                boundsGeral.extend(linhaNoMapa.getBounds());

                                if (dadosUbs) {
                                    turf.featureEach(dadosUbs, function (ubsPoligono) {
                                        if (turf.booleanIntersects(featureElemento, ubsPoligono)) {
                                            let extensaoTotalDaVia = 999;
                                            if(featureElemento.geometry.type.includes("Line")) {
                                                extensaoTotalDaVia = turf.length(featureElemento, {units: 'kilometers'}) * 1000;
                                            }
                                            let extensaoInterna = calcularExtensaoDentro(featureElemento, ubsPoligono);
                                            
                                            if (extensaoInterna < 15 && extensaoTotalDaVia > 15) return;

                                            let nomeUbs = ubsPoligono.properties.UBS;
                                            if (!ubsNomes.has(nomeUbs)) {
                                                ubsNomes.add(nomeUbs);
                                                ubsEncontradasFeatures.push(ubsPoligono);
                                            }
                                        }
                                    });
                                }
                            }
                        });
                    }
                }

                if (ubsEncontradasFeatures.length > 0) {
                    let htmlResultado = "";
                    if (temNumero) {
                        htmlResultado = `📍 <b>Numeração identificada com precisão!</b><br>Este endereço pertence exclusivamente à área de atendimento da:<br><br>`;
                    } else {
                        htmlResultado = `Logradouro identificado! Atravessa a área de abrangência de <b>${ubsEncontradasFeatures.length}</b> UBS(s):<br><br>`;
                    }
                    
                    // Montagem das UBSs encontradas com os atributos solicitados
                    ubsEncontradasFeatures.forEach(feature => {
                        // Limpa o nome removendo possíveis prefixos "RN" para manter consistência
                        let nomeUbsLimpo = feature.properties.UBS ? feature.properties.UBS.replace(/^RN\s+/i, '').trim() : "Desconhecida";
                        
                        let codigo = feature.properties['Codigo microrregiao'] || feature.properties.codigo_microrregiao || "S/N";
                        let endereco = feature.properties.END || "";
                        let horario = feature.properties.Horario || "";

                        // NOVA SOLUÇÃO AQUI: Remove quebras de linha e escapa aspas duplas e simples
                        // Isso garante que seções de texto acidentais do JSON não quebrem o HTML
                        let endSeguro = endereco.replace(/(\r\n|\n|\r)/gm, " ");
                        let horSeguro = horario.replace(/(\r\n|\n|\r)/gm, " ");

                        let nomeArgs = nomeUbsLimpo.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        let endArgs = endSeguro.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        let horArgs = horSeguro.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                        let argsCliq = `'${nomeArgs}', '${endArgs}', '${horArgs}'`;

                        htmlResultado += `<div class="ubs-item">
                            📍 <span class="ubs-clickable" onclick="abrirPopupUbs(${argsCliq})">UBS ${nomeUbsLimpo} - Cod. Microgregião (<b>${codigo}</b>)</span>
                        </div>`;
                        
                        const poliLayer = L.geoJSON(feature, {
                            style: { color: "#10b981", weight: 2.5, fillOpacity: 0.12 }
                        }).addTo(camadasPoligonos);
                        
                        boundsGeral.extend(poliLayer.getBounds());

                        try {
                            let centro = turf.centerOfMass(feature);
                            let coords = centro.geometry.coordinates;
                            
                            L.marker([coords[1], coords[0]], {
                                icon: L.divIcon({
                                    className: 'rotulo-ubs',
                                    html: `<div>UBS ${nomeUbsLimpo.toUpperCase()}</div>`,
                                    iconSize: [160, 40],
                                    iconAnchor: [80, 20]
                                }),
                                interactive: false
                            }).addTo(camadasPoligonos);
                        } catch (e) {}
                    });

                    // Inserção da nota de rodapé dinâmica
                    if (!temNumero && ubsEncontradasFeatures.length > 1) {
                        htmlResultado += `<br><small style="color:#64748b; font-weight:normal;"><i>Nota: Esta via abrange múltiplas regiões. Para saber a UBS exata, inclua o número do imóvel na próxima busca.</i><br>
                        📍 Quer saber o endereço? clique ou toque no icone da sua UBS</small>`;
                    } else {
                        htmlResultado += `<br><small style="color:#64748b; font-weight:normal;"><i>Nota: Quer saber o endereço? clique ou toque na sua UBS</i></small>`;
                    }

                    mostrarResultado(htmlResultado, "sucesso");
                    
                    if (temNumero) {
                        map.setView([latCentro, lonCentro], 16);
                    } else {
                        map.fitBounds(boundsGeral, { padding: [30, 30] }); 
                    }

                } else {
                    mostrarResultado("Endereço localizado, mas não intercepta nenhuma área de UBS cadastrada.", "erro");
                    if (boundsGeral.isValid()) {
                        map.fitBounds(boundsGeral, { padding: [30, 30] });
                    } else {
                        map.setView([latCentro, lonCentro], 15);
                    }
                }
            })
            .catch(error => {
                mostrarResultado(`Ops! Ocorreu um erro: ${error.message}`, "erro");
                console.error(error);
            });
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>
</body>
</html>
