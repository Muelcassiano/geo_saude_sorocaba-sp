<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Endereço por UBS - Sorocaba</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        /* Estilização Moderna e Responsiva */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f6f9; 
            color: #333;
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { margin-top: 0; color: #1e293b; font-size: 24px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 20px; }
        
        .busca-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #3b82f6; }
        button { 
            padding: 14px 28px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px; 
            white-space: nowrap; 
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        
        /* Ajuste Dinâmico do Mapa para telas Mobile e PC */
        #map { 
            height: 55vh; 
            min-height: 350px;
            max-height: 600px;
            width: 100%; 
            margin-top: 20px; 
            border-radius: 8px; 
            display: none; 
            z-index: 1; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        #resultado { 
            margin-top: 20px; 
            padding: 18px; 
            border-radius: 6px; 
            font-weight: 600; 
            line-height: 1.5;
            display: none; 
            word-wrap: break-word;
        }
        
        .sucesso { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .erro { background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        .info { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        .rotulo-ubs {
            background: none;
            border: none;
            box-shadow: none;
            font-size: 14px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            text-shadow: 
                -2px -2px 0 #FFF, 2px -2px 0 #FFF, 
                -2px 2px 0 #FFF, 2px 2px 0 #FFF,
                -1px 0px 0 #FFF, 1px 0px 0 #FFF,
                0px -1px 0 #FFF, 0px 1px 0 #FFF;
        }

        /* Responsividade para Celulares */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .busca-box { flex-direction: column; }
            button { width: 100%; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Descubra sua UBS - Sorocaba</h2>
    <p>Digite seu logradouro (Ex: Avenida Itavuvu):</p>
    
    <div class="busca-box">
        <input type="text" id="endereco" placeholder="Rua, avenida, Sorocaba - SP">
        <button onclick="buscarEndereco()">Buscar</button>
    </div>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<script>
    let dadosUbs = null;
    let map = null;
    let camadasBusca = L.layerGroup();
    let camadasPoligonos = L.layerGroup(); 

    document.getElementById('endereco').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { buscarEndereco(); }
    });

    function initMap(lat, lon, zoom = 13) {
        const mapDiv = document.getElementById('map');
        mapDiv.style.display = 'block';
        if (!map) {
            map = L.map('map').setView([lat, lon], zoom);
            
            // CORREÇÃO: Voltando para o estilo clássico e colorido do OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            camadasBusca.addTo(map);
            camadasPoligonos.addTo(map);
        }
        setTimeout(() => { map.invalidateSize(); }, 200);
    }

    // Carrega a base de dados GeoJSON
    fetch('abrangencia_ubs_sorocaba.json')
        .then(response => {
            if (!response.ok) throw new Error("Falha ao carregar o arquivo abrangencia_ubs_sorocaba.json.");
            return response.json();
        })
        .then(data => { dadosUbs = data; })
        .catch(error => mostrarResultado("Erro ao carregar banco de dados das UBS. Verifique se o arquivo JSON está na mesma pasta.", "erro"));

    function buscarEndereco() {
        let enderecoDigitado = document.getElementById('endereco').value.trim();
        if (!enderecoDigitado) {
            mostrarResultado("Por favor, digite um logradouro.", "erro");
            return;
        }

        const buscaFinal = enderecoDigitado.toLowerCase().includes("sorocaba") ? enderecoDigitado : `${enderecoDigitado}, Sorocaba, SP`;
        mostrarResultado("Analisando malha viária e conectando trechos...", "info");

        // CORREÇÃO: Aumentado o limit para 100 para capturar os segmentos de ponta a ponta da avenida
        const urlGeocode = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaFinal)}&limit=100&polygon_geojson=1&polygon_threshold=0.001&accept-language=pt-BR&email=geosaude.sorocaba.app@gmail.com`;

        fetch(urlGeocode)
            .then(response => {
                if (!response.ok) throw new Error(`Erro do servidor de mapas: ${response.status}`);
                return response.json();
            })
            .then(resultados => {
                if (resultados.length === 0) throw new Error("Logradouro não encontrado na base de dados. Tente verificar a grafia.");

                camadasBusca.clearLayers();
                camadasPoligonos.clearLayers();

                let viasEncontradas = resultados.filter(r => r.class === 'highway');
                let alvosGeograficos = [];

                if (viasEncontradas.length > 0) {
                    let nomeOficialDaRua = viasEncontradas[0].name;
                    alvosGeograficos = viasEncontradas.filter(r => r.name === nomeOficialDaRua);
                } else {
                    alvosGeograficos = [resultados[0]];
                }

                initMap(parseFloat(alvosGeograficos[0].lat), parseFloat(alvosGeograficos[0].lon));

                let ubsEncontradasFeatures = [];
                let ubsNomes = new Set();
                let boundsGeral = L.latLngBounds();
                
                // --------------------------------------------------------------------------------
                // GAP FILLER: Conecta os pontos da rua para resolver as lacunas (Linha Guia)
                // --------------------------------------------------------------------------------
                let linhaGuiaContinua = null;
                try {
                    let centroides = alvosGeograficos.map(alvo => {
                        let feat = turf.feature(alvo.geojson);
                        return turf.centroid(feat);
                    });

                    let centroidesOrdenados = [];
                    if (centroides.length > 0) {
                        let restantes = [...centroides];
                        let atual = restantes.splice(0, 1)[0];
                        centroidesOrdenados.push(atual);
                        
                        while (restantes.length > 0) {
                            let idxMaisProximo = 0;
                            let menorDistancia = Infinity;
                            for (let i = 0; i < restantes.length; i++) {
                                let d = turf.distance(atual, restantes[i]);
                                if (d < menorDistancia) {
                                    menorDistancia = d;
                                    idxMaisProximo = i;
                                }
                            }
                            atual = restantes.splice(idxMaisProximo, 1)[0];
                            centroidesOrdenados.push(atual);
                        }
                    }

                    // Limpa coordenadas duplicadas para evitar erro no Turf.js
                    let coordenadasLimpas = [];
                    centroidesOrdenados.forEach(c => {
                        let coords = c.geometry.coordinates;
                        if(coordenadasLimpas.length === 0) {
                            coordenadasLimpas.push(coords);
                        } else {
                            let ult = coordenadasLimpas[coordenadasLimpas.length - 1];
                            if(ult[0] !== coords[0] || ult[1] !== coords[1]) {
                                coordenadasLimpas.push(coords);
                            }
                        }
                    });

                    if (coordenadasLimpas.length > 1) {
                        linhaGuiaContinua = turf.lineString(coordenadasLimpas);
                    }
                } catch (err) {
                    console.warn("Aviso: Não foi possível computar a linha guia de preenchimento.", err);
                }
                // --------------------------------------------------------------------------------

                // Itera sobre os segmentos que vieram da API
                alvosGeograficos.forEach(alvo => {
                    const formatoGeoJson = alvo.geojson;
                    const featureElemento = turf.feature(formatoGeoJson);

                    // Desenha o que existe de fato no mapa (Vermelho)
                    const linhaNoMapa = L.geoJSON(formatoGeoJson, {
                        style: { color: "#ff2222", weight: 5, opacity: 0.85 },
                        pointToLayer: (feature, latlng) => L.marker(latlng)
                    }).addTo(camadasBusca);
                    
                    boundsGeral.extend(linhaNoMapa.getBounds());

                    // Verifica as intersecções (pelo pedaço da via OU pela linha guia invisível)
                    if (dadosUbs) {
                        turf.featureEach(dadosUbs, function (ubsPoligono) {
                            let cruzaSegmentoReal = turf.booleanIntersects(featureElemento, ubsPoligono);
                            let cruzaLinhaGuia = linhaGuiaContinua ? turf.booleanIntersects(linhaGuiaContinua, ubsPoligono) : false;

                            if (cruzaSegmentoReal || cruzaLinhaGuia) {
                                let nomeUbs = ubsPoligono.properties.UBS;
                                
                                if (!ubsNomes.has(nomeUbs)) {
                                    ubsNomes.add(nomeUbs);
                                    ubsEncontradasFeatures.push(ubsPoligono);
                                }
                            }
                        });
                    }
                });

                if (ubsEncontradasFeatures.length > 0) {
                    let htmlResultado = `Logradouro identificado! Cruza a área de abrangência de <b>${ubsEncontradasFeatures.length}</b> UBS(s):<br><br>`;
                    
                    ubsEncontradasFeatures.forEach(feature => {
                        let nomeUbs = feature.properties.UBS;
                        htmlResultado += `📍 UBS ${nomeUbs}<br>`;
                        
                        const poliLayer = L.geoJSON(feature, {
                            style: { color: "#10b981", weight: 2.5, fillOpacity: 0.12 }
                        }).addTo(camadasPoligonos);
                        
                        boundsGeral.extend(poliLayer.getBounds());

                        try {
                            let centro = turf.centerOfMass(feature);
                            let coords = centro.geometry.coordinates;
                            
                            L.marker([coords[1], coords[0]], {
                                icon: L.divIcon({
                                    className: 'rotulo-ubs',
                                    html: `<div>UBS ${nomeUbs.toUpperCase()}</div>`,
                                    iconSize: [160, 40],
                                    iconAnchor: [80, 20]
                                }),
                                interactive: false
                            }).addTo(camadasPoligonos);
                        } catch (e) {}
                    });

                    if (ubsEncontradasFeatures.length > 1) {
                         htmlResultado += `<br><small style="color:#64748b; font-weight:normal;"><i>Nota: Esta via cruza múltiplas regiões. Para saber a UBS exata, inclua a numeração no momento da busca no futuro.</i></small>`;
                    }

                    mostrarResultado(htmlResultado, "sucesso");
                    map.fitBounds(boundsGeral, { padding: [30, 30] }); 

                } else {
                    mostrarResultado("Logradouro localizado, mas fora das áreas de UBS cadastradas.", "erro");
                    map.fitBounds(boundsGeral, { padding: [30, 30] });
                }
            })
            .catch(error => {
                mostrarResultado(`Ops! Ocorreu um erro: ${error.message}`, "erro");
                console.error(error);
            });
    }

    function mostrarResultado(mensagem, tipo) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = message = mensagem;
        divResultado.style.display = 'block';
        divResultado.className = tipo;
    }
</script>
</body>
</html>
